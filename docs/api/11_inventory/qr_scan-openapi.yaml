openapi: 3.0.3
info:
  title: SSSM Inventory - QR Scans API
  version: 2.0.0
  description: >-
    API de résolution de QR codes (module a11_inventory/qr_scan), dérivée du
    contrôleur QrScanController. Toutes les routes exigent un JWT
    (Authorization: Bearer …).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: QR Scans
    description: Résolution de QR codes
paths:
  /api/v1/inventory/scans/resolve:
    post:
      operationId: resolveQrScan
      tags: [ QR Scans ]
      summary: Résoudre un QR code vers l'article correspondant
      description: >-
        La résolution est **strictement limitée à l'entreprise de l'appelant**
        (revendiquée dans le JWT). Un code inconnu, archivé ou appartenant à
        une autre entreprise renvoie 404 : l'existence d'un code dans une autre
        entreprise n'est jamais révélée.

        La réponse est enrichie : type, catégorie, entrepôt courant et, le cas
        échéant, l'affectation active avec son détenteur et son poste. Aucun
        champ technique interne (UUID d'archivage, dates de mise à jour) n'est
        exposé.

        Chaque tentative, résolue ou non, alimente le journal `qr_scan`.
        Le nombre de résolutions est limité par utilisateur et par entreprise
        (`app.qr.scan.max-per-minute`, 120 par défaut) : au-delà, la réponse
        est 429 `RATE_LIMITED`.

        `deviceId` est facultatif : il identifie le terminal qui scanne et
        figure dans le journal.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/QrScanRequest' } }
      responses:
        '200':
          description: Article résolu et enrichi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrScan' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: >-
        Requête invalide (JSON illisible, code vide, champ trop long,
        validation) - Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré - Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: >-
        JWT valide mais sans entreprise, ou sans permission d'inventaire -
        Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: >-
        Code inconnu, archivé ou appartenant à une autre entreprise - Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: >-
        Limite de débit de résolution atteinte - Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    QrScanRequest:
      type: object
      required: [ qrCode ]
      properties:
        qrCode:
          type: string
          maxLength: 100
          description: >-
            Code scanné, comparé exactement (casse comprise) au code porté par
            l'article. Un code au format UUID est traité comme un texte.
        deviceId:
          type: string
          maxLength: 100
          description: Identifiant du terminal qui scanne, journalisé.
    QrScan:
      type: object
      properties:
        id: { type: string, format: uuid }
        qr_code: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ItemStatus' }
        item_type: { $ref: '#/components/schemas/QrScanItemType' }
        category: { $ref: '#/components/schemas/QrScanCategory' }
        warehouse: { $ref: '#/components/schemas/QrScanWarehouse' }
        active_assignment: { $ref: '#/components/schemas/QrScanAssignment' }
    ItemStatus:
      type: string
      enum: [ AVAILABLE, ASSIGNED, DAMAGED, LOST, REPAIR, RETIRED ]
    QrScanItemType:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, nullable: true }
        name: { type: string, nullable: true }
    QrScanCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
    QrScanWarehouse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
    QrScanAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        assigned_at: { type: string, format: date-time, nullable: true }
        expected_return_at: { type: string, format: date-time, nullable: true }
        employee: { $ref: '#/components/schemas/QrScanEmployee' }
        post: { $ref: '#/components/schemas/QrScanPost' }
    QrScanEmployee:
      type: object
      properties:
        id: { type: string, format: uuid }
        employee_number: { type: string, nullable: true }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
    QrScanPost:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, nullable: true }
        name: { type: string, nullable: true }
