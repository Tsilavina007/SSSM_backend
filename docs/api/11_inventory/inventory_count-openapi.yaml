openapi: 3.0.3
info:
  title: SSSM Inventory — Inventory Counts API
  version: 1.0.0
  description: >-
    API des inventaires (module a11_inventory/inventory_count), dérivée du
    contrôleur InventoryCountController. Toutes les routes exigent un JWT
    (Authorization: Bearer …). Les corps utilisent des DTO typés
    (InventoryCountCreateRequest, InventoryCountScanRequest,
    InventoryCountCloseRequest) ; les scans appliquent en plus une liste blanche
    stricte (champ inconnu → 400). Réponses en 200 possibles : ligne sérialisée
    en InventoryCountRest, ou enveloppe {"errors": ItemError} (corps vide /
    aucune colonne writable / inventaire introuvable) — les opérations de
    sauvegarde conservent ce comportement doux et ne renvoient pas 404.
    Pagination : page=1, pageSize=50 (max 500).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Inventory Counts
    description: Inventaires et scans
paths:
  /api/inventory/inventory-counts:
    get:
      tags: [ Inventory Counts ]
      summary: Lister les inventaires
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des inventaires
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InventoryCount' } }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Inventory Counts ]
      summary: Créer un inventaire
      description: >-
        (company_id, reference) est unique : un doublon provoque une erreur 500
        (SQLState 23505).
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/InventoryCountUpsert' } }
      responses:
        '200':
          description: 'Inventaire créé, ou enveloppe {"errors": ItemError} si le corps
            est vide ou sans colonne writable'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/InventoryCount' }
                  - { $ref: '#/components/schemas/FamilyCError' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/inventory-counts/{id}/scans:
    parameters:
      - { $ref: '#/components/parameters/InventoryCountId' }
    post:
      tags: [ Inventory Counts ]
      summary: Enregistrer un scan (écart d'inventaire)
      description: >-
        Le scan est inséré dans inventory_count_scan (jamais dans la table
        inventaire). Colonnes acceptées : inventory_count_id (accepté puis
        ignoré — la route fait foi), item_id, scanned_by, scanned_at,
        expected_warehouse_id, actual_warehouse_id, discrepancy_type, notes.
        Tout autre champ → 400 « unknown field ».
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/InventoryCountScanCreate' } }
      responses:
        '200':
          description: Scan enregistré (scanned_at absent → défaut base now())
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryCountScan' }
        '400':
          description: >-
            Erreur client structurée (enveloppe {"errors": …}) — item_id
            manquant/vides, UUID invalide, scanned_at invalide, discrepancy_type
            hors CHECK, champ inconnu, doublon (inventory_count_id, item_id) ou
            FK inexistante (SQLState 23505/23503).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: 'Inventaire introuvable (enveloppe {"errors": …})'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/inventory-counts/{id}/results:
    parameters:
      - { $ref: '#/components/parameters/InventoryCountId' }
    get:
      tags: [ Inventory Counts ]
      summary: Lister les scans (résultats) d un inventaire
      responses:
        '200':
          description: Liste des scans — vide si l'inventaire n'existe pas (pas de 404)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InventoryCountScan' } }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/inventory-counts/{id}/close:
    parameters:
      - { $ref: '#/components/parameters/InventoryCountId' }
    post:
      tags: [ Inventory Counts ]
      summary: Clôturer un inventaire
      description: >-
        Sans corps → {"status": "COMPLETED"} appliqué (seule valeur de fermeture
        valide du CHECK). Un corps {} vide → 200 enveloppe {"errors":
        ItemError}. Un statut hors CHECK (ex. "CLOSED") provoque une erreur 500.
        completed_at n'est pas renseigné par cette route (dette préexistante
        conservée).
      requestBody:
        required: false
        content:
          application/json: { schema: { $ref: '#/components/schemas/InventoryCountClose' } }
      responses:
        '200':
          description: 'Inventaire clôturé, ou enveloppe {"errors": ItemError} (corps {})'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/InventoryCount' }
                  - { $ref: '#/components/schemas/FamilyCError' }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    InventoryCountId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Erreur serveur ou SQL (500) — enveloppe ItemError (message, detail,
        code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    ItemError:
      type: object
      required: [message, detail, code]
      properties:
        message:
          type: string
          description: Message lisible en français, toujours renseigné.
        detail:
          type: string
          description: Précision contextuelle (identifiant, champ, contrainte SQL, cause).
        code:
          type: string
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR) ou SQLState PostgreSQL (ex. 23505).
    FamilyCError:
      type: object
      description: >-
        Erreur douce renvoyée en 200 par les opérations de cette famille
        (enveloppe ItemError, code NOT_FOUND ou BAD_REQUEST).
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    InventoryCountStatus:
      type: string
      enum: [ IN_PROGRESS, COMPLETED, CANCELLED ]
    DiscrepancyType:
      type: string
      enum: [ NONE, MISSING, UNEXPECTED, WRONG_LOCATION, DAMAGED ]
    InventoryCount:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/InventoryCountStatus' }
        started_by: { type: string, format: uuid, nullable: true }
        completed_by: { type: string, format: uuid, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
    InventoryCountUpsert:
      type: object
      description: >-
        Corps typé (InventoryCountCreateRequest). Les champs absents ne sont pas
        transmis au SQL. Colonnes NOT NULL sans défaut : company_id,
        warehouse_id, reference — leur omission provoque une erreur 500 (et non
        400). status a pour défaut IN_PROGRESS, started_at pour défaut now().
      required: [ company_id, warehouse_id, reference ]
      additionalProperties: false
      properties:
        notes: { type: string, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        completed_by: { type: string, format: uuid, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        started_by: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/InventoryCountStatus' }
        reference: { type: string }
        warehouse_id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
    InventoryCountClose:
      type: object
      description: >-
        Corps facultatif de clôture (InventoryCountCloseRequest). Sans corps,
        le service applique le statut COMPLETED.
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/InventoryCountStatus' }
        completed_by: { type: string, format: uuid, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
    InventoryCountScanCreate:
      type: object
      description: >-
        Corps strict (liste blanche) : un champ inconnu → 400. item_id est
        requis. scanned_at accepte une chaîne ISO-8601 (Instant ou
        LocalDateTime) ou un horodatage epoch ; une valeur invalide → 400.
        inventory_count_id, s présent, est ignoré (la route fait foi).
      required: [ item_id ]
      additionalProperties: false
      properties:
        item_id: { type: string, format: uuid }
        scanned_by: { type: string, format: uuid, nullable: true }
        scanned_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: number }
          description: ISO-8601 ou epoch (secondes/millisecondes) — défaut base now() si
            absent.
        expected_warehouse_id: { type: string, format: uuid, nullable: true }
        actual_warehouse_id: { type: string, format: uuid, nullable: true }
        discrepancy_type: { $ref: '#/components/schemas/DiscrepancyType' }
        notes: { type: string, nullable: true }
        inventory_count_id:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: Accepté puis ignoré.
          }
    InventoryCountScan:
      type: object
      properties:
        id: { type: string, format: uuid }
        inventory_count_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        scanned_by: { type: string, format: uuid, nullable: true }
        scanned_at: { type: string, format: date-time, nullable: true }
        expected_warehouse_id: { type: string, format: uuid, nullable: true }
        actual_warehouse_id: { type: string, format: uuid, nullable: true }
        discrepancy_type: { $ref: '#/components/schemas/DiscrepancyType' }
        notes: { type: string, nullable: true }
        qr_code: { type: string, nullable: true }
