openapi: 3.0.3
info:
  title: SSSM Inventory — Inventory Counts API
  version: 1.1.0
  description: >-
    API des inventaires (module a11_inventory/inventory_count), dérivée du
    contrôleur InventoryCountController. Toutes les routes exigent un JWT
    (Authorization: Bearer …) et sont cloisonnées par entreprise : l'entreprise
    est lue dans le jeton, jamais dans le corps. Un inventaire d'une autre
    entreprise est traité comme inexistant (404).

    À l'ouverture, le serveur fige un instantané des quantités attendues pour
    tous les articles non archivés de l'entreprise ; un article d'une autre
    entreprise, archivé ou créé après l'ouverture est hors périmètre (409
    ITEM_OUT_OF_SCOPE). L'écart est toujours calculé par le serveur. La clôture
    est idempotente, refuse un inventaire vide et journalise un mouvement
    ADJUSTMENT par écart non nul. Pagination : page=1, pageSize=50 (max 500).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Inventory Counts
    description: Inventaires et scans
paths:
  /api/v1/inventory/inventory-counts:
    get:
      tags: [ Inventory Counts ]
      operationId: listInventoryCounts
      summary: Lister les inventaires de l'entreprise
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des inventaires de l'entreprise du jeton
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageInventoryCount' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [ Inventory Counts ]
      operationId: createInventoryCount
      summary: Ouvrir un inventaire
      description: >-
        L'entreprise, le statut IN_PROGRESS, l'auteur et l'horodatage de départ
        sont pilotés par le serveur. Le corps ne porte que l'entrepôt compté, la
        référence et une note libre ; tout autre champ est ignoré. L'ouverture
        fige l'instantané des attendus (table inventory_count_expected).
        La référence est unique par entreprise : un doublon renvoie 409.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/InventoryCountCreate' } }
      responses:
        '201':
          description: Inventaire ouvert, avec son instantané d'attendus figé
          headers:
            Location:
              description: URI de l'inventaire créé.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryCount' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Entrepôt introuvable dans l'entreprise (Problem Details RFC 9457)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Référence déjà utilisée par un inventaire de l'entreprise
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/inventory/inventory-counts/{id}:
    parameters:
      - { $ref: '#/components/parameters/InventoryCountId' }
    get:
      tags: [ Inventory Counts ]
      operationId: getInventoryCount
      summary: Consulter un inventaire
      responses:
        '200':
          description: Inventaire de l'entreprise du jeton
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryCount' }
        '404':
          description: Inventaire inconnu ou appartenant à une autre entreprise
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/inventory/inventory-counts/{id}/scans:
    parameters:
      - { $ref: '#/components/parameters/InventoryCountId' }
    post:
      tags: [ Inventory Counts ]
      operationId: scanInventoryCount
      summary: Enregistrer un scan (écart d'inventaire)
      description: >-
        L'attendu (expected_quantity, expected_warehouse_id) est lu dans
        l'instantané figé à l'ouverture. Un article absent de cet instantané
        (autre entreprise, archivé, créé après l'ouverture) est refusé en 409
        ITEM_OUT_OF_SCOPE. L'écart, le type d'écart et l'emplacement attendu ne
        sont jamais fournis par le client : si les champs correspondants sont
        envoyés, ils sont ignorés. counted_quantity vaut 1 par défaut.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/InventoryCountScanCreate' } }
      responses:
        '200':
          description: Scan enregistré avec écart calculé par le serveur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryCountScan' }
        '400':
          description: >-
            Erreur client structurée (Problem Details RFC 9457) — item_id
            manquant/vide, UUID invalide, quantité négative, scanned_at
            invalide, champ inconnu, entrepôt constaté d'une autre entreprise,
            doublon (inventory_count_id, item_id) ou FK inexistante.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Inventaire inconnu ou d'une autre entreprise
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: >-
            Inventaire non IN_PROGRESS (COUNT_NOT_OPEN) ou article hors
            périmètre (ITEM_OUT_OF_SCOPE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/inventory/inventory-counts/{id}/results:
    parameters:
      - { $ref: '#/components/parameters/InventoryCountId' }
    get:
      tags: [ Inventory Counts ]
      operationId: listInventoryCountLines
      summary: Lister les lignes paginées d'un inventaire
      description: >-
        Les lignes sont paginées. Le total est exposé dans l'en-tête
        X-Total-Count (ainsi que X-Page et X-Page-Size) pour rester compatible
        avec la réponse tableau.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Lignes du comptage pour la page demandée
          headers:
            X-Total-Count:
              description: Nombre total de lignes du comptage
              schema: { type: integer, minimum: 0 }
            X-Page:
              description: Page renvoyée
              schema: { type: integer, minimum: 1 }
            X-Page-Size:
              description: Taille de page appliquée (max 500)
              schema: { type: integer, minimum: 1, maximum: 500 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageInventoryCountScan' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Inventaire inconnu ou d'une autre entreprise
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/inventory/inventory-counts/{id}/close:
    parameters:
      - { $ref: '#/components/parameters/InventoryCountId' }
    post:
      tags: [ Inventory Counts ]
      operationId: closeInventoryCount
      summary: Clôturer un inventaire (idempotent)
      description: >-
        Un inventaire déjà COMPLETED est renvoyé tel quel (200) sans nouvelle
        écriture. Un inventaire sans aucune ligne est refusé (409 COUNT_EMPTY).
        Un inventaire CANCELLED ne peut pas être clôturé (409 COUNT_CANCELLED).
        La clôture est transactionnelle : elle réconcilie les articles et les
        soldes, renseigne item.last_inventory_at, completed_at et completed_by
        (porteur du jeton), puis journalise un mouvement ADJUSTMENT par ligne
        dont l'écart figé est non nul (quantité |écart|, source = entrepôt
        attendu pour une diminution, destination = entrepôt constaté pour une
        augmentation).
      requestBody:
        required: false
        content:
          application/json: { schema: { $ref: '#/components/schemas/InventoryCountClose' } }
      responses:
        '200':
          description: Inventaire clôturé (ou déjà clôturé)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryCount' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Inventaire inconnu ou d'une autre entreprise
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: >-
            Inventaire vide (COUNT_EMPTY) ou annulé (COUNT_CANCELLED), ou
            transition concurrente perdue.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/inventory/inventory-counts/{id}/cancel:
    parameters:
      - { $ref: '#/components/parameters/InventoryCountId' }
    post:
      tags: [ Inventory Counts ]
      operationId: cancelInventoryCount
      summary: Annuler un inventaire (idempotent)
      description: >-
        Passe un inventaire IN_PROGRESS à CANCELLED sans appliquer d'ajustement
        ni toucher aux soldes ou aux articles. Un inventaire déjà CANCELLED est
        renvoyé tel quel (200). Un inventaire COMPLETED ne peut pas être annulé
        (409 COUNT_COMPLETED).
      responses:
        '200':
          description: Inventaire annulé (ou déjà annulé)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryCount' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Inventaire inconnu ou d'une autre entreprise
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Inventaire déjà clôturé (COUNT_COMPLETED)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    InventoryCountId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Compte sans entreprise ou sans permission d'inventaire (403).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    PageInventoryCount:
      type: object
      description: Réponse de pagination normalisée (page 1-based, taille plafonnée).
      required: [ items, page, pageSize, total, totalPages ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InventoryCount' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 500 }
        total: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    PageInventoryCountScan:
      type: object
      description: Réponse de pagination normalisée (page 1-based, taille plafonnée).
      required: [ items, page, pageSize, total, totalPages ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InventoryCountScan' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 500 }
        total: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    InventoryCountStatus:
      type: string
      enum: [ IN_PROGRESS, COMPLETED, CANCELLED ]
    DiscrepancyType:
      type: string
      enum: [ NONE, MISSING, UNEXPECTED, WRONG_LOCATION, DAMAGED ]
    InventoryCount:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/InventoryCountStatus' }
        started_by: { type: string, format: uuid, nullable: true }
        completed_by: { type: string, format: uuid, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
    InventoryCountCreate:
      type: object
      description: >-
        Corps de création (InventoryCountCreateRequest). L'entreprise, le statut,
        l'auteur et les horodatages sont pilotés par le serveur ; tout champ
        supplémentaire est ignoré.
      required: [ warehouse_id, reference ]
      properties:
        warehouse_id:
          type: string
          format: uuid
          description: Entrepôt compté, actif et appartenant à l'entreprise du jeton.
        reference:
          type: string
          description: Référence unique par entreprise.
        notes: { type: string, nullable: true }
    InventoryCountClose:
      type: object
      description: >-
        Corps facultatif de clôture (InventoryCountCloseRequest). Le statut et
        completed_at sont pilotés par le serveur ; completed_by ne sert que de
        repli hors contexte authentifié.
      properties:
        completed_by: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
    InventoryCountScanCreate:
      type: object
      description: >-
        Corps strict (liste blanche) : un champ inconnu → 400. item_id est
        requis. scanned_at accepte une chaîne ISO-8601 (Instant ou
        LocalDateTime) ou un horodatage epoch ; une valeur invalide → 400.
        counted_quantity vaut 1 par défaut ; négatif → 400.
      required: [ item_id ]
      additionalProperties: false
      properties:
        item_id: { type: string, format: uuid }
        counted_quantity:
          type: number
          minimum: 0
          default: 1
          description: Quantité physiquement constatée (2 décimales maximum).
        scanned_by: { type: string, format: uuid, nullable: true }
        scanned_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: number }
          description: ISO-8601 ou epoch — défaut base now() si absent.
        actual_warehouse_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Emplacement constaté ; défaut = entrepôt du comptage. Doit
            appartenir à l'entreprise du jeton (400 sinon).
        expected_warehouse_id:
          type: string
          format: uuid
          nullable: true
          description: Ignoré — l'attendu est lu dans l'instantané figé.
        discrepancy_type:
          allOf:
            - { $ref: '#/components/schemas/DiscrepancyType' }
          description: Ignoré — le type d'écart est calculé par le serveur.
        notes: { type: string, nullable: true }
        inventory_count_id:
          type: string
          format: uuid
          nullable: true
          description: Accepté puis ignoré (la route fait foi).
    InventoryCountScan:
      type: object
      properties:
        id: { type: string, format: uuid }
        inventory_count_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        scanned_by: { type: string, format: uuid, nullable: true }
        scanned_at: { type: string, format: date-time, nullable: true }
        expected_warehouse_id: { type: string, format: uuid, nullable: true }
        actual_warehouse_id: { type: string, format: uuid, nullable: true }
        expected_quantity: { type: number, minimum: 0 }
        counted_quantity: { type: number, minimum: 0 }
        difference: { type: number }
        discrepancy_type: { $ref: '#/components/schemas/DiscrepancyType' }
        notes: { type: string, nullable: true }
        qr_code: { type: string, nullable: true }
