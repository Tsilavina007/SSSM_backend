openapi: 3.0.3
info:
  title: SSSM Inventory — Stock Movements API
  version: 1.0.0
  description: >-
    API des mouvements de stock (module a11_inventory/stock_movement), dérivée
    du contrôleur StockMovementController. Toutes les routes exigent un JWT
    (Authorization: Bearer …). Erreurs : Problem Details RFC 9457 (`application/problem+json`) ; une requête malformée (JSON/UUID invalide) renvoie une erreur 400
    (Problem Details RFC 9457). Pagination : page=1, pageSize=10 par défaut. La
    validation Jakarta (`@Valid`) s'applique aux corps de création et de mise à
    jour. Le type de mouvement est facultatif à la création : le DAO applique IN
    lorsqu'il est absent. Le journal est append-only : `PATCH` et `DELETE`
    renvoient 409 `IMMUTABLE_RESOURCE`. Un `OUT` exige `employee_id` et `post_id`,
    crée une affectation active et retire l'article du stock disponible. Un
    `RETURN` clôt l'affectation active et restaure l'article. `IN`, `TRANSFER` et
    `DESTRUCTION` refusent un article ayant une affectation active.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Stock Movements
    description: Mouvements de stock
paths:
  /api/v1/inventory/movements:
    get:
      tags: [ Stock Movements ]
      summary: Lister les mouvements de stock
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des mouvements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageStockMovement' }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Stock Movements ]
      summary: Créer un mouvement de stock
      description: >-
        movement_date absent → défaut base now() mais la réponse fait écho du
        corps de la requête : movement_date y est alors null (comportement
        voulu, tests de non-régression associés).
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/StockMovementCreate' } }
      responses:
        '201':
          headers:
            Location:
              description: URI de la ressource créée.
              schema: { type: string, format: uri }
          description: Mouvement créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovement' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/inventory/movements/{movementId}:
    parameters:
      - { $ref: '#/components/parameters/MovementId' }
    get:
      tags: [ Stock Movements ]
      summary: Récupérer un mouvement par identifiant
      responses:
        '200':
          description: Mouvement trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovement' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [ Stock Movements ]
      summary: Modifier un mouvement (interdit)
      description: >-
        Le journal est append-only. Tout `PATCH` sur un mouvement existant
        renvoie 409 `IMMUTABLE_RESOURCE` ; un identifiant inconnu renvoie 404.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/StockMovementUpdate' } }
      responses:
        '409':
          description: Journal immuable — Problem Details RFC 9457.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [ Stock Movements ]
      summary: Supprimer un mouvement (interdit)
      description: >-
        Le journal est append-only. Tout `DELETE` sur un mouvement existant
        renvoie 409 `IMMUTABLE_RESOURCE` ; un identifiant inconnu renvoie 404.
      responses:
        '409':
          description: Journal immuable — Problem Details RFC 9457.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Recherche libre (ILIKE) selon la ressource.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    MovementId:
      name: movementId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable (404) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    PageStockMovement:
      type: object
      description: Réponse de pagination normalisée (page 1-based, taille plafonnée).
      required: [ items, page, pageSize, total, totalPages ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StockMovement' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 500 }
        total: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    MovementType:
      type: string
      enum: [ IN, OUT, TRANSFER, RETURN, ADJUSTMENT, DESTRUCTION ]
    StockMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid, nullable: true }
        movement_type: { $ref: '#/components/schemas/MovementType' }
        reference: { type: string, nullable: true }
        movement_date: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        source_warehouse_id: { type: string, format: uuid, nullable: true }
        destination_warehouse_id: { type: string, format: uuid, nullable: true }
        operation_id: { type: string, format: uuid, nullable: true }
        quantity: { type: number, format: decimal, nullable: true }
        performed_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
    StockMovementCreate:
      type: object
      description: >-
        Corps de création validé par Jakarta : warehouse_id et item_id sont
        obligatoires (400 sinon). movement_type (défaut applicatif IN) et
        movement_date (défaut base now()) sont facultatifs. Pour `OUT`,
        `employee_id` et `post_id` sont obligatoires (400 `CLIENT_ERROR` sinon)
        et une affectation active est créée atomiquement. Pour `RETURN`,
        l'affectation active est clôturée. Les mouvements `IN`, `TRANSFER` et
        `DESTRUCTION` sont refusés (409 `ITEM_ASSIGNED`) si l'article a une
        affectation active. Un `RETURN` sans affectation active sur un article
        qui n'est plus `ASSIGNED` renvoie 409 `ITEM_NOT_ASSIGNED`.
      required: [ warehouse_id, item_id ]
      properties:
        warehouse_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid, nullable: true }
        post_id: { type: string, format: uuid, nullable: true }
        movement_type: { $ref: '#/components/schemas/MovementType' }
        quantity: { type: number, format: decimal, minimum: 0.01, nullable: true }
        source_warehouse_id: { type: string, format: uuid, nullable: true }
        destination_warehouse_id: { type: string, format: uuid, nullable: true }
        operation_id: { type: string, format: uuid, nullable: true }
        performed_by: { type: string, format: uuid, nullable: true }
        reference: { type: string, nullable: true }
        movement_date: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
    StockMovementUpdate:
      type: object
      description: >-
        Corps accepté pour compatibilité mais toute modification existante
        renvoie 409 `IMMUTABLE_RESOURCE`.
      properties:
        warehouse_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid, nullable: true }
        movement_type: { $ref: '#/components/schemas/MovementType' }
        reference: { type: string, nullable: true }
        movement_date: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
