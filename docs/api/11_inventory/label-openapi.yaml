openapi: 3.0.3
info:
  title: SSSM Inventory - Labels API
  version: 1.0.0
  description: >-
    API des étiquettes imprimables (module a11_inventory/label), dérivée du
    contrôleur LabelController. Toutes les routes exigent un JWT
    (Authorization: Bearer …) et une permission d'inventaire.

    Les étiquettes sont rendues en HTML : le QR code est intégré directement
    dans la page (donnée base64) et le texte est lisible. Aucune dépendance
    PDF n'est ajoutée : l'impression ou l'export PDF se fait depuis le
    navigateur. Une planche de cent étiquettes est produite en un seul appel.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Labels
    description: Étiquettes et planches d'étiquettes
paths:
  /api/v1/inventory/items/{itemId}/label:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      operationId: getItemLabel
      tags: [ Labels ]
      summary: Étiquette imprimable d'un article
      description: >-
        Renvoie une étiquette HTML : QR code intégré, code lisible, type,
        description, catégorie, entrepôt et entreprise. Un article inconnu
        renvoie 404.
      parameters:
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 100, maximum: 1000, default: 300 }
          description: Taille du QR code intégré en pixels (300 par défaut).
      responses:
        '200':
          description: Étiquette HTML
          content:
            text/html:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/inventory/labels/batch:
    post:
      operationId: getItemLabelsBatch
      tags: [ Labels ]
      summary: Planche d'étiquettes
      description: >-
        Produit la planche HTML d'un lot d'articles (100 maximum) en un seul
        appel. Les articles introuvables ou hors entreprise sont ignorés.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/QrLabelBatchRequest' } }
      responses:
        '200':
          description: Planche HTML
          content:
            text/html:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, liste vide, taille hors bornes) - Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré - Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Article introuvable dans l'entreprise de l'appelant - Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    QrLabelBatchRequest:
      type: object
      required: [ item_ids ]
      properties:
        item_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
          description: Articles à étiqueter.
        size:
          type: integer
          minimum: 100
          maximum: 1000
          default: 300
          description: Taille du QR code intégré en pixels.
