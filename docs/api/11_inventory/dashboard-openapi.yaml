openapi: 3.0.3
info:
  title: SSSM Inventory — Dashboard API
  version: 1.0.0
  description: >-
    API du tableau de bord inventaire (module a11_inventory/dashboard), dérivée
    du contrôleur DashboardController. Toutes les routes exigent un JWT
    (Authorization: Bearer …). Lecture seule ; les deux routes renvoient des
    tableaux (agrégats par entreprise).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Dashboard
    description: Tableau de bord et alertes
paths:
  /api/v1/inventory/dashboard/summary:
    get:
      tags: [ Dashboard ]
      summary: Synthèse du tableau de bord
      responses:
        '200':
          description: >-
            Tableau d'agrégats (un objet par entreprise) : compteurs d'articles,
            d'entrepôts et d'opérations.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DashboardSummary' } }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/inventory/alerts/low-stock:
    get:
      tags: [ Dashboard ]
      summary: Alertes de stock bas
      responses:
        '200':
          description: Tableau des articles sous le seuil minimum
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DashboardLowStock' } }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters: {}
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    ItemStatus:
      type: string
      enum: [ AVAILABLE, ASSIGNED, DAMAGED, LOST, REPAIR, RETIRED ]
    DashboardSummary:
      type: object
      properties:
        items: { type: integer, format: int64, nullable: true }
        warehouses: { type: integer, format: int64, nullable: true }
        operations: { type: integer, format: int64, nullable: true }
    DashboardLowStock:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        code: { type: string, nullable: true }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        quantity_total: { type: number, nullable: true }
        minimum_stock: { type: number, nullable: true }
        status: { $ref: '#/components/schemas/ItemStatus' }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        stock_quantity: { type: integer, format: int64, nullable: true }
