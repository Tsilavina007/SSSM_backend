openapi: 3.0.3
info:
  title: SSSM Inventory — Assignments API (deprecated facade)
  version: 2.0.0
  description: >-
    Façade dépréciée de l'ancien module `a11_inventory/assignment`. Toutes les
    routes délèguent désormais au service canonique
    `ItemAssignmentService` et au contrat `item_assignment-openapi.yaml` :
    mêmes validations, mêmes DTO typés, mêmes codes HTTP et même cycle de vie.
    Le JSON libre et les réponses 200 portant une erreur douce ont été
    supprimés.

    Les réponses de succès portent `Deprecation: true` et
    `Link: </api/v1/item-assignments>; rel="successor-version"`. Les erreurs
    suivent un Problem Details RFC 9457 et ne portent pas
    ces en-têtes. Préférez `/api/v1/item-assignments` ; cette façade ne reçoit que
    des correctifs de compatibilité.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Assignments (deprecated)
    description: Façade de compatibilité — utiliser /api/v1/item-assignments
paths:
  /api/v1/inventory/assignments:
    get:
      operationId: listAssignments
      tags: [ Assignments (deprecated) ]
      summary: Lister les affectations
      deprecated: true
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Active' }
      responses:
        '200':
          $ref: '#/components/responses/AssignmentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createAssignment
      tags: [ Assignments (deprecated) ]
      summary: Créer une affectation
      deprecated: true
      description: >-
        Mêmes règles que `POST /api/v1/item-assignments` : article `AVAILABLE`,
        aucune affectation active sans `returned_at`, création atomique de l'état
        `ASSIGNED` et du stock.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ItemAssignmentCreate' } }
      responses:
        '201':
          $ref: '#/components/responses/AssignmentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/inventory/assignments/{itemAssignmentId}:
    parameters:
      - { $ref: '#/components/parameters/ItemAssignmentId' }
    get:
      operationId: getAssignment
      tags: [ Assignments (deprecated) ]
      summary: Récupérer une affectation
      deprecated: true
      responses:
        '200':
          $ref: '#/components/responses/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      operationId: updateAssignment
      tags: [ Assignments (deprecated) ]
      summary: Mettre à jour les métadonnées
      deprecated: true
      description: >-
        Mêmes règles que le PATCH canonique : liens et `assigned_at` immuables,
        `returned_at` délègue au retour, `condition_on_return` seul renvoie 400
        `RETURN_ENDPOINT_REQUIRED`.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ItemAssignmentUpdate' } }
      responses:
        '200':
          $ref: '#/components/responses/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: archiveAssignment
      tags: [ Assignments (deprecated) ]
      summary: Archiver une affectation inactive
      deprecated: true
      description: >-
        Une affectation active renvoie 409 `ACTIVE_ASSIGNMENT` ; une affectation
        déjà voidée renvoie 409 `ASSIGNMENT_ALREADY_VOIDED` ; un identifiant
        inconnu renvoie 404.
      parameters:
        - { $ref: '#/components/parameters/ReasonOptional' }
      responses:
        '204':
          $ref: '#/components/responses/NoContentDeprecated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/inventory/assignments/{itemAssignmentId}/return:
    parameters:
      - { $ref: '#/components/parameters/ItemAssignmentId' }
    post:
      operationId: returnAssignment
      tags: [ Assignments (deprecated) ]
      summary: Enregistrer un retour
      deprecated: true
      description: >-
        Corps facultatif ; seul `condition_on_return` est lu. Date et acteur du
        retour sont posés par le serveur.
      requestBody:
        required: false
        content:
          application/json: { schema: { $ref: '#/components/schemas/ItemAssignmentReturn' } }
      responses:
        '200':
          $ref: '#/components/responses/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/inventory/assignments/{itemAssignmentId}/void:
    parameters:
      - { $ref: '#/components/parameters/ItemAssignmentId' }
    post:
      operationId: voidAssignment
      tags: [ Assignments (deprecated) ]
      summary: Annuler et auditer une affectation
      deprecated: true
      parameters:
        - { $ref: '#/components/parameters/ReasonRequired' }
      responses:
        '200':
          $ref: '#/components/responses/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/inventory/assignments/{itemAssignmentId}/restore:
    parameters:
      - { $ref: '#/components/parameters/ItemAssignmentId' }
    post:
      operationId: restoreAssignment
      tags: [ Assignments (deprecated) ]
      summary: Restaurer une affectation voidée
      deprecated: true
      responses:
        '200':
          $ref: '#/components/responses/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/inventory/items/{itemId}/assignments:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      operationId: listAssignmentsByItem
      tags: [ Assignments (deprecated) ]
      summary: Lister les affectations non voidées d'un article
      deprecated: true
      description: Jusqu'à 500 lignes, retours inclus, voidées exclues.
      responses:
        '200':
          $ref: '#/components/responses/AssignmentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/inventory/employees/{employeeId}/assignments:
    parameters:
      - { $ref: '#/components/parameters/EmployeeId' }
    get:
      operationId: listAssignmentsByEmployee
      tags: [ Assignments (deprecated) ]
      summary: Lister les affectations non voidées d'un employé
      deprecated: true
      description: Jusqu'à 500 lignes, retours inclus, voidées exclues.
      responses:
        '200':
          $ref: '#/components/responses/AssignmentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/inventory/security-posts/{postId}/assignments:
    parameters:
      - { $ref: '#/components/parameters/PostId' }
    get:
      operationId: listAssignmentsByPost
      tags: [ Assignments (deprecated) ]
      summary: Lister les affectations non voidées d'un poste
      deprecated: true
      description: Jusqu'à 500 lignes, retours inclus, voidées exclues.
      responses:
        '200':
          $ref: '#/components/responses/AssignmentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    Deprecation:
      description: Marqueur de dépréciation.
      schema: { type: string, example: 'true' }
    Link:
      description: Lien vers le successeur canonique.
      schema: { type: string, example: '</api/v1/item-assignments>; rel="successor-version"' }
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 10 }
    Active:
      name: active
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: Si vrai, uniquement les affectations actives.
    ReasonRequired:
      name: reason
      in: query
      required: true
      schema: { type: string }
    ReasonOptional:
      name: reason
      in: query
      required: false
      schema: { type: string }
    ItemAssignmentId:
      name: itemAssignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Assignment:
      description: Affectation sérialisée avec les en-têtes de dépréciation.
      headers:
        Deprecation: { $ref: '#/components/headers/Deprecation' }
        Link: { $ref: '#/components/headers/Link' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ItemAssignment' }
    AssignmentCreated:
      description: Affectation créée avec les en-têtes de dépréciation.
      headers:
        Deprecation: { $ref: '#/components/headers/Deprecation' }
        Link: { $ref: '#/components/headers/Link' }
        Location:
          description: URI de l'affectation créée.
          schema: { type: string, format: uri }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ItemAssignment' }
    AssignmentList:
      description: Liste d'affectations avec les en-têtes de dépréciation.
      headers:
        Deprecation: { $ref: '#/components/headers/Deprecation' }
        Link: { $ref: '#/components/headers/Link' }
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/ItemAssignment' }
    NoContentDeprecated:
      description: Affectation archivée (sans corps), avec les en-têtes de dépréciation.
      headers:
        Deprecation: { $ref: '#/components/headers/Deprecation' }
        Link: { $ref: '#/components/headers/Link' }
    BadRequest:
      description: Requête invalide — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Affectation ou article introuvable — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: >-
        Conflit de cycle de vie ou d'unicité — Problem Details RFC 9457. Cette façade
        renvoie les mêmes codes que le contrat canonique, sans erreur douce.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    ItemAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid, nullable: true }
        item_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        assigned_at: { type: string, format: date-time }
        returned_at: { type: string, format: date-time, nullable: true }
        condition_on_assignment: { type: string, nullable: true }
        condition_on_return: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        assigned_by: { type: string, format: uuid, nullable: true }
        returned_by: { type: string, format: uuid, nullable: true }
        expected_return_at: { type: string, format: date-time, nullable: true }
        source_warehouse_id: { type: string, format: uuid, nullable: true }
        voided_at: { type: string, format: date-time, nullable: true }
        voided_by: { type: string, format: uuid, nullable: true }
        void_reason: { type: string, nullable: true }
    ItemAssignmentCreate:
      type: object
      required: [ item_id, employee_id, post_id ]
      properties:
        item_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        assigned_at: { type: string, format: date-time, nullable: true }
        returned_at: { type: string, format: date-time, nullable: true }
        condition_on_assignment: { type: string, nullable: true }
        condition_on_return: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        expected_return_at: { type: string, format: date-time, nullable: true }
    ItemAssignmentUpdate:
      type: object
      properties:
        item_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        assigned_at: { type: string, format: date-time, nullable: true }
        returned_at: { type: string, format: date-time, nullable: true }
        condition_on_assignment: { type: string, nullable: true }
        condition_on_return: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        expected_return_at: { type: string, format: date-time, nullable: true }
    ItemAssignmentReturn:
      type: object
      properties:
        condition_on_return: { type: string, nullable: true }
