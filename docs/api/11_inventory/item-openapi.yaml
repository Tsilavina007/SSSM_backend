openapi: 3.0.3
info:
  title: SSSM Inventory — Items API
  version: 1.0.0
  description: >-
    API des articles (module a11_inventory/item), dérivée du contrôleur
    ItemController. Toutes les routes exigent un JWT (Authorization: Bearer …).
    Erreurs : enveloppe {"errors": {message, detail, code}} pour les exceptions
    métier du module ; une requête malformée (JSON/UUID invalide) renvoie
    l'erreur enveloppe ItemError. Pagination : page=1, pageSize=10 par défaut.
    La validation Jakarta (`@Valid`) s'applique aux corps de création et de mise à
    jour : les champs obligatoires et les tailles maximales sont contrôlés avant
    l'accès à la base. Les relations facultatives absentes sont sérialisées à
    null.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Items
    description: Articles (équipements)
paths:
  /api/inventory/items:
    get:
      tags: [ Items ]
      summary: Lister les articles
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: warehouseId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filtrer par entrepôt.
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ItemStatus' }
          description: Filtrer par statut.
      responses:
        '200':
          description: Liste paginée des articles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Item' } }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Items ]
      summary: Créer un article
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ItemCreate' } }
      responses:
        '201':
          description: Article créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/items/bulk:
    post:
      tags: [ Items ]
      summary: Créer plusieurs articles (partiellement atomique)
      description: >-
        Chaque article est inséré indépendamment : les échecs sont regroupés
        dans failedItems sans annuler les succès.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/ItemCreate' } }
      responses:
        '200':
          description: Résultats du lot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemBulkResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/items/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [ Items ]
      summary: Récupérer un article par identifiant
      responses:
        '200':
          description: Article trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateItem
      tags: [ Items ]
      summary: Mettre à jour partiellement un article
      description: >-
        Le code QR est **immuable** (décision D-05) : le champ `qr_code` est
        refusé avec 400 `IMMUTABLE_QR_CODE`. Modifier un code invaliderait les
        étiquettes déjà imprimées, sans laisser de trace. Un code erroné se
        corrige en recréant l'article.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ItemUpdate' } }
      responses:
        '200':
          description: Article mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [ Items ]
      summary: Archiver un article
      description: >-
        Archivage logique : renseigne `archived_at`/`archived_by`, retire le
        stock disponible et conserve la ligne. Un article avec une affectation
        active renvoie 409 `ITEM_ASSIGNED`. Un identifiant inconnu ou déjà
        archivé renvoie 404 `NOT_FOUND`.
      responses:
        '204':
          description: Article archivé (sans corps).
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Affectation active ou état incompatible — enveloppe ItemError.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/items/{itemId}/restore:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    post:
      operationId: restoreItem
      tags: [ Items ]
      summary: Restaurer un article archivé
      description: >-
        Efface `archived_at`/`archived_by` et réintègre le stock disponible si
        l'article est `AVAILABLE` et rattaché à un entrepôt. Un article non
        archivé renvoie 409 `ITEM_NOT_ARCHIVED`.
      responses:
        '200':
          description: Article restauré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Article déjà actif — enveloppe ItemError.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/items/{itemId}/qr-code:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [ Items ]
      summary: Récupérer le QR code d'un article
      responses:
        '200':
          description: QR code de l'article
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemQrCode' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/items/{itemId}/qr-code/image:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      operationId: getItemQrCodeImage
      tags: [ Items ]
      summary: Générer l'image PNG du QR code d'un article
      description: >-
        En cas de succès le corps est toujours une image PNG
        (Content-Type image/png). En cas d'erreur l'enveloppe ItemError
        {"errors": {message, detail, code}} est renvoyée en application/json :

        * 400 (code BAD_REQUEST) : itemId n'est pas un UUID valide
        (ex. "1", détail : "La valeur '1' n'est pas un UUID valide.") ;

        * 404 (code NOT_FOUND) : aucun article ne correspond à itemId ;

        * 500 (code QR_CODE_MISSING) : l'article existe mais sa colonne
        qr_code est absente ou vide (incohérence de données) ;

        * 500 (code QR_CODE_GENERATION_FAILED) : l'encodage ZXing ou
        l'écriture du flux PNG a échoué (détail technique dans detail).

        L'image est **mise en cache** (`Cache-Control: public, max-age=300`) et
        identifiée par un `ETag` dérivé de l'article, de son code QR et de la
        taille demandée. Une requête portant l'`ETag` reçu renvoie 304 sans
        corps.

        Négociation de contenu : les erreurs sont gérées localement et
        sérialisées en application/json avec un Content-Type explicite, de
        sorte que l'enveloppe reste lisible même si le client n'accepte que
        Accept: image/png (sinon le GlobalExceptionHandler échouerait avec une
        HttpMediaTypeNotAcceptableException). L'attribut Accept doit néanmoins
        contenir image/png pour que la route elle-même soit sélectionnée.
      parameters:
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 100, maximum: 1000, default: 300 }
          description: Côté de l'image PNG en pixels (300 par défaut).
      responses:
        '200':
          description: Image PNG du QR code
          headers:
            ETag:
              description: Empreinte de l'image, à renvoyer dans If-None-Match.
              schema: { type: string }
            Cache-Control:
              description: Politique de cache HTTP de l'image.
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
        '304':
          description: Image inchangée (ETag correspondant) - sans corps.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/items/{itemId}/history:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [ Items ]
      summary: Consulter l'historique d'un article
      description: >-
        Retourne les mouvements de stock et les affectations associés à
        l'article.
      responses:
        '200':
          description: Historique de l'article
          content:
            application/json:
              schema:
                type: object
                properties:
                  item_id: { type: string, format: uuid }
                  movements: { type: array, items: { type: object } }
                  assignments: { type: array, items: { type: object } }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Recherche libre (ILIKE) selon la ressource.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Ressource introuvable (404) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Erreur serveur ou SQL (500) — enveloppe ItemError (message, detail,
        code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    ItemError:
      type: object
      required: [message, detail, code]
      properties:
        message:
          type: string
          description: Message lisible en français, toujours renseigné.
        detail:
          type: string
          description: Précision contextuelle (identifiant, champ, contrainte SQL, cause).
        code:
          type: string
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR) ou SQLState PostgreSQL (ex. 23505).
    ItemStatus:
      type: string
      enum: [ AVAILABLE, ASSIGNED, DAMAGED, LOST, REPAIR, RETIRED ]
    CompanyBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    AgencyBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        name: { type: string }
    BranchBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        agence: { $ref: '#/components/schemas/AgencyBrief' }
        name: { type: string }
    ItemCategoryBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        company: { $ref: '#/components/schemas/CompanyBrief' }
        name: { type: string }
        description: { type: string, nullable: true }
    ItemTypeBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        company: { $ref: '#/components/schemas/CompanyBrief' }
        category: { $ref: '#/components/schemas/ItemCategoryBrief' }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
    WarehouseBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { $ref: '#/components/schemas/CompanyBrief' }
        branch: { $ref: '#/components/schemas/BranchBrief' }
        name: { type: string }
    Item:
      type: object
      description: >-
        Article sérialisé en ItemRest, avec objets imbriqués (company, category,
        item_type, current_warehouse). Les relations facultatives absentes sont
        à null.
      properties:
        id: { type: string, format: uuid }
        company: { $ref: '#/components/schemas/CompanyBrief' }
        category: { $ref: '#/components/schemas/ItemCategoryBrief' }
        item_type: { $ref: '#/components/schemas/ItemTypeBrief' }
        current_warehouse: { $ref: '#/components/schemas/WarehouseBrief' }
        qr_code: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ItemStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
        archived_by: { type: string, format: uuid, nullable: true }
        last_inventory_at: { type: string, format: date-time, nullable: true }
    ItemQrCode:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, nullable: true }
        item_type_id: { type: string, format: uuid }
        current_warehouse_id: { type: string, format: uuid, nullable: true }
        qr_code: { type: string }
    ItemCreate:
      type: object
      description: >-
        Corps de création validé par Jakarta. Les champs obligatoires sont
        contrôlés avant l'accès à la base et leur omission renvoie 400.
      required: [ company_id, item_type_id, qr_code ]
      properties:
        company_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, nullable: true }
        item_type_id: { type: string, format: uuid }
        qr_code: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ItemStatus' }
        current_warehouse_id: { type: string, format: uuid, nullable: true }
    ItemUpdate:
      type: object
      description: >-
        Tous les champs sont facultatifs (mise à jour partielle), sauf
        `qr_code` qui est refusé (400 `IMMUTABLE_QR_CODE`).
      properties:
        company_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, nullable: true }
        item_type_id: { type: string, format: uuid }
        qr_code:
          type: string
          readOnly: true
          description: >-
            Lecture seule : toute valeur fournie est refusée avec 400
            `IMMUTABLE_QR_CODE` (décision D-05, le code est stable après
            impression).
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ItemStatus' }
        current_warehouse_id: { type: string, format: uuid, nullable: true }
    ItemBulkResult:
      type: object
      properties:
        createdItems:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        failedItems:
          type: array
          items:
            type: object
            properties:
              item: { $ref: '#/components/schemas/ItemCreate' }
              errors: { $ref: '#/components/schemas/ItemError' }
