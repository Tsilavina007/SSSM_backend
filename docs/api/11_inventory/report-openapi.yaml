openapi: 3.0.3
info:
  title: SSSM Inventory — Reports API
  version: 1.0.0
  description: >-
    API des rapports d'inventaire (module a11_inventory/report), dérivée du
    contrôleur ReportController. Toutes les routes exigent un JWT
    (Authorization: Bearer …). Lecture seule. Pagination : page=1, pageSize=50
    (max 500).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Reports
    description: Rapports (lecture seule)
paths:
  /api/v1/inventory/reports/movements:
    get:
      tags: [ Reports ]
      summary: Rapport des mouvements de stock
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: itemId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filtrer par article.
        - name: warehouseId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filtrer par entrepôt.
      responses:
        '200':
          description: Liste paginée des mouvements enrichis (colonnes brutes de
            stock_movement)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageReportMovement' }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    PageReportMovement:
      type: object
      description: Réponse de pagination normalisée (page 1-based, taille plafonnée).
      required: [ items, page, pageSize, total, totalPages ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportMovement' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 500 }
        total: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    MovementType:
      type: string
      enum: [ IN, OUT, TRANSFER, RETURN, ADJUSTMENT, DESTRUCTION ]
    ReportMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid, nullable: true }
        item_id: { type: string, format: uuid, nullable: true }
        employee_id: { type: string, format: uuid, nullable: true }
        movement_type: { $ref: '#/components/schemas/MovementType' }
        reference: { type: string, nullable: true }
        movement_date: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        source_warehouse_id: { type: string, format: uuid, nullable: true }
        destination_warehouse_id: { type: string, format: uuid, nullable: true }
        operation_id: { type: string, format: uuid, nullable: true }
        quantity: { type: number, nullable: true }
        performed_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
