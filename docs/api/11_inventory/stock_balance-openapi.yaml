openapi: 3.0.3
info:
  title: SSSM Inventory — Stock Balances API
  version: 1.0.0
  description: >-
    API des soldes de stock par entrepôt et type (module a11_inventory/stock_balance),
    dérivée du contrôleur StockBalanceController. Toutes les routes exigent un JWT
    (Authorization: Bearer …). Lecture seule. Pagination : page=1, pageSize=50
    (max 500). Le solde est calculé à partir des mouvements validés, des opérations,
    des comptages clôturés et des synchronisations d'article : c'est la source de
    vérité du stock disponible.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Stock Balances
    description: Soldes de stock par entrepôt et type
paths:
  /api/v1/inventory/stock-balances:
    get:
      operationId: listStockBalances
      tags: [ Stock Balances ]
      summary: Lister les soldes de stock
      description: >-
        Renvoie les soldes calculés par (entreprise, entrepôt, type de matériel).
        Chaque ligne expose la quantité disponible, le seuil minimum et un indicateur
        `below_minimum`. Les filtres sont optionnels et combinables.
      parameters:
        - name: warehouseId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filtrer par entrepôt.
        - name: itemTypeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filtrer par type de matériel.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des soldes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageStockBalance' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            Filtre `warehouseId` ou `itemTypeId` malformé : code `INVALID_IDENTIFIER`.
            Comportement propre à ce contrôleur, qui ne suit pas encore la convention
            `400 BAD_REQUEST` des autres routes pour un UUID invalide.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: Numéro de page (1-based). page=0 est normalisé à 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      description: Nombre d'éléments par page, plafonné à 500.
  responses:
    BadRequest:
      description: Requête invalide (UUID ou paramètre malformé, validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    StockBalance:
      type: object
      required:
        - id
        - company_id
        - warehouse_id
        - warehouse_name
        - item_type_id
        - item_type_code
        - item_type_name
        - quantity
        - minimum_stock
        - below_minimum
        - version
        - updated_at
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        warehouse_name: { type: string }
        item_type_id: { type: string, format: uuid }
        item_type_code: { type: string }
        item_type_name: { type: string }
        quantity:
          type: number
          description: 'Quantité disponible, toujours >= 0.'
        minimum_stock:
          type: number
          description: 'Seuil minimum effectif : entrepôt si défini, sinon type.'
        below_minimum: { type: boolean, description: Vrai si quantity < minimum_stock. }
        version: { type: integer, format: int64, description: Version optimistic-lock du solde. }
        updated_at: { type: string, format: date-time, description: Dernière mise à jour du solde (UTC). }
    PageStockBalance:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StockBalance' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, format: int64 }
        totalPages: { type: integer, minimum: 0 }