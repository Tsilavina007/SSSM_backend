openapi: 3.0.3
info:
  title: SSSM Inventory — Warehouses API
  version: 1.0.0
  description: >-
    API des entrepôts (module a11_inventory/warehouse), dérivée du contrôleur
    WarehouseController. Toutes les routes exigent un JWT (Authorization: Bearer
    …). Erreurs : Problem Details RFC 9457 (`application/problem+json`) ; une requête
    malformée renvoie l'erreur Problem Details RFC 9457. Pagination : page=1,
    pageSize=10 par défaut. La validation Jakarta (`@Valid`) s'applique aux
    corps de création et de mise à jour.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Warehouses
    description: Entrepôts
paths:
  /api/v1/inventory/warehouses:
    get:
      tags: [ Warehouses ]
      summary: Lister les entrepôts
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des entrepôts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Warehouse' } }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Warehouses ]
      summary: Créer un entrepôt
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/WarehouseCreate' } }
      responses:
        '201':
          headers:
            Location:
              description: URI de la ressource créée.
              schema: { type: string, format: uri }
          description: Entrepôt créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/inventory/warehouses/{warehouseId}:
    parameters:
      - { $ref: '#/components/parameters/WarehouseId' }
    get:
      tags: [ Warehouses ]
      summary: Récupérer un entrepôt par identifiant
      responses:
        '200':
          description: Entrepôt trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [ Warehouses ]
      summary: Mettre à jour partiellement un entrepôt
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/WarehouseUpdate' } }
      responses:
        '200':
          description: Entrepôt mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [ Warehouses ]
      summary: Archiver un entrepôt
      description: >-
        Archivage logique : renseigne `archived_at`/`archived_by` et exclut
        l'entrepôt des listes. Un identifiant inconnu ou déjà archivé renvoie
        404 `NOT_FOUND`.
      responses:
        '204':
          description: Entrepôt archivé (sans corps).
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/inventory/warehouses/{warehouseId}/restore:
    parameters:
      - { $ref: '#/components/parameters/WarehouseId' }
    post:
      operationId: restoreWarehouse
      tags: [ Warehouses ]
      summary: Restaurer un entrepôt archivé
      description: >-
        Efface `archived_at`/`archived_by`. Un entrepôt non archivé renvoie
        409 `WAREHOUSE_NOT_ARCHIVED`.
      responses:
        '200':
          description: Entrepôt restauré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Entrepôt déjà actif — Problem Details RFC 9457.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Recherche libre (ILIKE) selon la ressource.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable (404) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    CompanyBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    AgencyBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        name: { type: string }
    BranchBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        agence: { $ref: '#/components/schemas/AgencyBrief' }
        name: { type: string }
    Warehouse:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { $ref: '#/components/schemas/CompanyBrief' }
        branch: { $ref: '#/components/schemas/BranchBrief' }
        name: { type: string }
        address: { type: string, nullable: true }
        active: { type: boolean, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
    WarehouseCreate:
      type: object
      description: >-
        Corps de création validé par Jakarta : company_id et name sont
        obligatoires (400 sinon). active reçoit true par défaut.
      required: [ company_id, name ]
      properties:
        company_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        address: { type: string, nullable: true }
        active: { type: boolean, nullable: true }
    WarehouseUpdate:
      type: object
      description: Tous les champs sont facultatifs (mise à jour partielle).
      properties:
        company_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        address: { type: string, nullable: true }
        active: { type: boolean, nullable: true }
