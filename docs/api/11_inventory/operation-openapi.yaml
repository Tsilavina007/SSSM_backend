openapi: 3.0.3
info:
  title: SSSM Inventory — Operations API
  version: 1.0.0
  description: >-
    API des opérations d'inventaire (module a11_inventory/operation), dérivée du
    contrôleur OperationController. Toutes les routes exigent un JWT
    (Authorization: Bearer …). Les corps utilisent OperationRequest. Attention :
    l'operation_type n'est PAS déduit de la route choisie (dette connue,
    préexistant) — il doit figurer dans le corps, sinon l'insertion échoue en
    500 (NOT NULL sans défaut). Les champs inconnus sont ignorés. Réponses en
    200 : ligne sérialisée en OperationRest, ou Problem Details RFC 9457
    si le corps est vide ou sans colonne writable. Aucune lecture ou suppression
    n'est exposée (routes de création uniquement).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Operations
    description: Opérations (réception, sortie, transfert)
paths:
  /api/v1/inventory/operations/receipt:
    post:
      tags: [ Operations ]
      summary: Créer une opération de réception
      description: >-
        L'operation_type n'est pas renseigné automatiquement : fournir
        "operation_type": "RECEIPT" dans le corps pour une opération conforme.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OperationUpsert' } }
      responses:
        '201':
          description: Opération créée
          headers:
            Location:
              description: URI de l'opération créée.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/inventory/operations/issue:
    post:
      tags: [ Operations ]
      summary: Créer une opération de sortie
      description: >-
        L'operation_type n'est pas renseigné automatiquement : fournir
        "operation_type": "ISSUE" dans le corps pour une opération conforme.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OperationUpsert' } }
      responses:
        '201':
          description: Opération créée
          headers:
            Location:
              description: URI de l'opération créée.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/inventory/operations/transfer:
    post:
      tags: [ Operations ]
      summary: Créer une opération de transfert
      description: >-
        L'operation_type n'est pas renseigné automatiquement : fournir
        "operation_type": "TRANSFER" dans le corps pour une opération conforme.
        Contrainte base : source_warehouse_id ≠ destination_warehouse_id (sinon 422).
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OperationUpsert' } }
      responses:
        '201':
          description: Opération créée
          headers:
            Location:
              description: URI de l'opération créée.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters: {}
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    OperationType:
      type: string
      enum: [ RECEIPT, ISSUE, TRANSFER, ASSIGNMENT, RETURN, ADJUSTMENT ]
    OperationStatus:
      type: string
      enum: [ PENDING, COMPLETED, CANCELLED, FAILED ]
    Operation:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        operation_type: { $ref: '#/components/schemas/OperationType' }
        status: { $ref: '#/components/schemas/OperationStatus' }
        reference: { type: string, nullable: true }
        idempotency_key: { type: string, nullable: true }
        source_warehouse_id: { type: string, format: uuid, nullable: true }
        destination_warehouse_id: { type: string, format: uuid, nullable: true }
        employee_id: { type: string, format: uuid, nullable: true }
        post_id: { type: string, format: uuid, nullable: true }
        performed_by: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    OperationUpsert:
      type: object
      description: >-
        Corps typé (OperationRequest). Les champs absents ne sont pas transmis
        au SQL et les champs inconnus sont ignorés. company_id et
        operation_type sont NOT NULL sans défaut : leur omission renvoie 400.
        status a pour défaut PENDING.
      required: [ company_id, operation_type ]
      additionalProperties: true
      properties:
        company_id: { type: string, format: uuid }
        operation_type: { $ref: '#/components/schemas/OperationType' }
        status: { $ref: '#/components/schemas/OperationStatus' }
        reference: { type: string, nullable: true }
        idempotency_key: { type: string, nullable: true }
        source_warehouse_id: { type: string, format: uuid, nullable: true }
        destination_warehouse_id: { type: string, format: uuid, nullable: true }
        employee_id: { type: string, format: uuid, nullable: true }
        post_id: { type: string, format: uuid, nullable: true }
        performed_by: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
