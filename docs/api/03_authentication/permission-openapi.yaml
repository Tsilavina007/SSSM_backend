openapi: 3.0.3
info:
  title: SSSM Authentication — Permissions API
  version: 1.0.0
  description: >-
    API des permissions (module a03_authentication/permission), dérivée du
    contrôleur PermissionController. Toutes les routes exigent le rôle ADMIN.
    Toutes les erreurs renvoient un Problem Details RFC 9457 (`application/problem+json`)
    : 400 (requête invalide, JSON illisible ou UUID malformé), 401 (JWT absent,
    invalide ou expiré), 403 (rôle ADMIN manquant), 404 (permission introuvable
    lors d'une mise à jour), 500 (erreur serveur inattendue ; erreurs SQL traduites en 400/409/422/503). Pagination : page=1,
    pageSize=10 par défaut.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Permissions
    description: Permissions (ADMIN)
paths:
  /api/v1/permissions:
    get:
      tags: [ Permissions ]
      summary: Lister les permissions
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des permissions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        '403':
          $ref: '#/components/responses/Forbidden'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [ Permissions ]
      summary: Créer une permission
      description: >-
        Un doublon renvoie 409, une violation NOT NULL 400, avec un Problem Details RFC 9457.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Permission' } }
      responses:
        '201':
          headers:
            Location:
              description: URI de la ressource créée.
              schema: { type: string, format: uri }
          description: Permission créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/permissions/{id}:
    parameters:
      - { $ref: '#/components/parameters/PermissionId' }
    get:
      tags: [ Permissions ]
      summary: Récupérer une permission par identifiant
      description: >-
        Un identifiant inexistant renvoie 404 avec l'Problem Details RFC 9457.
      responses:
        '200':
          description: Permission trouvée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [ Permissions ]
      summary: Mettre à jour partiellement une permission
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        NotFoundException → 404 (Problem Details RFC 9457). La réponse est l'objet
        envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Permission' } }
      responses:
        '200':
          description: Permission mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ Permissions ]
      summary: Supprimer une permission
      description: Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    PermissionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Rôle ADMIN manquant (403) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable (404) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    Permission:
      type: object
      required: [ code, name ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, maxLength: 150, description: Unique. }
        name: { type: string, maxLength: 150 }
        description: { type: string, nullable: true }
