openapi: 3.0.3
info:
  title: SSSM Authentication — Roles API
  version: 1.0.0
  description: >-
    API des rôles (module a03_authentication/role), dérivée du contrôleur
    RoleController. Toutes les routes exigent le rôle ADMIN. Toutes les erreurs
    renvoient un Problem Details RFC 9457 (`application/problem+json`) : 400 (requête
    invalide, JSON illisible ou UUID malformé), 401 (JWT absent, invalide ou
    expiré), 403 (rôle ADMIN manquant), 404 (rôle introuvable lors d'une mise à
    jour), 500 (erreur serveur inattendue ; erreurs SQL traduites en 400/409/422/503). Pagination : page=1, pageSize=10 par
    défaut. Attention : RoleDAO.create appelle UUID.fromString(company_id) sans
    garde ; un company_id null (rôle global) provoque une erreur 500.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Roles
    description: Rôles et permissions associées (ADMIN)
paths:
  /api/v1/roles:
    get:
      tags: [ Roles ]
      summary: Lister les rôles
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des rôles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Role' } }
        '403':
          $ref: '#/components/responses/Forbidden'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [ Roles ]
      summary: Créer un rôle
      description: >-
        Une erreur SQL est traduite en 400/409/422/503 avec un Problem Details RFC 9457.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Role' } }
      responses:
        '201':
          headers:
            Location:
              description: URI de la ressource créée.
              schema: { type: string, format: uri }
          description: Rôle créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/roles/{id}:
    parameters:
      - { $ref: '#/components/parameters/RoleId' }
    get:
      tags: [ Roles ]
      summary: Récupérer un rôle par identifiant
      description: >-
        Un identifiant inexistant renvoie 404 avec l'Problem Details RFC 9457.
      responses:
        '200':
          description: Rôle trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [ Roles ]
      summary: Mettre à jour partiellement un rôle
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        NotFoundException → 404 (Problem Details RFC 9457). La réponse est l'objet
        envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Role' } }
      responses:
        '200':
          description: Rôle mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ Roles ]
      summary: Supprimer un rôle
      description: Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/roles/{roleId}/permissions/{permissionId}:
    parameters:
      - { $ref: '#/components/parameters/RoleIdPath' }
      - { $ref: '#/components/parameters/PermissionId' }
    post:
      tags: [ Roles ]
      summary: Attribuer une permission à un rôle
      description: Insertion idempotente (ON CONFLICT DO NOTHING). Réponse 204 sans
        corps.
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [ Roles ]
      summary: Retirer une permission à un rôle
      description: Réponse 204 sans corps, même si l'association n'existe pas.
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    RoleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleIdPath:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Rôle ADMIN manquant (403) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable (404) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    Role:
      type: object
      required: [ name ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id:
          type: string
          format: uuid
          nullable: true
          description: Obligatoire en pratique à la création (UUID.fromString sans garde).
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true }
