openapi: 3.0.3
info:
  title: SSSM Authentication — Users API
  version: 1.0.0
  description: >-
    API des utilisateurs (module a03_authentication/user), dérivée du contrôleur
    AppUserController. Toutes les routes exigent le rôle ADMIN
    (hasRole("ADMIN")), en plus du JWT. Toutes les erreurs renvoient l'enveloppe
    {"errors": {message, detail, code}} : 400 (validation, doublon de username
    ou d'email, JSON illisible ou UUID malformé), 401 (JWT absent, invalide ou
    expiré), 403 (rôle ADMIN manquant), 404 (utilisateur introuvable), 500
    (erreur serveur ou SQL).
    Pagination : page=1, pageSize=10 par défaut. Les corps de POST et PATCH
    utilisent des DTO dédiés : id, password_hash et les horodatages ne peuvent
    pas être fournis par le client. Le mot de passe est haché avant insertion
    et n'est jamais renvoyé. POST /api/users est réservé aux administrateurs ;
    les doublons de username ou d'email renvoient 400.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Users
    description: Utilisateurs (ADMIN)
paths:
  /api/users:
    get:
      tags: [ Users ]
      summary: Lister les utilisateurs
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des utilisateurs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AppUser' } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Users ]
      summary: Créer un utilisateur
      description: >-
        Crée un compte avec un mot de passe haché. username, email et password
        sont obligatoires ; status vaut ACTIVE par défaut. Les champs id,
        password_hash et les horodatages sont ignorés s'ils sont fournis.
        Un username ou un email déjà utilisé renvoie 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppUserCreateRequest' }
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppUser' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/users/{id}:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    get:
      tags: [ Users ]
      summary: Récupérer un utilisateur par identifiant
      description: Un identifiant inconnu renvoie 404 avec l'enveloppe d'erreur.
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppUser' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [ Users ]
      summary: Mettre à jour partiellement un utilisateur
      description: >-
        Seuls les champs du DTO de mise à jour sont modifiables : email,
        password, first_name, last_name, phone et status. Un mot de passe fourni
        est haché. username, company_id, id et password_hash ne sont pas
        modifiables. Un identifiant inconnu renvoie 404 et un email déjà utilisé
        renvoie 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppUserUpdateRequest' }
      responses:
        '200':
          description: Utilisateur mis à jour (objet d'entrée complété de l'id)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppUser' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [ Users ]
      summary: Supprimer un utilisateur
      description: Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/users/{userId}/roles/{roleId}:
    parameters:
      - { $ref: '#/components/parameters/UserIdPath' }
      - { $ref: '#/components/parameters/RoleId' }
    post:
      tags: [ Users ]
      summary: Attribuer un rôle à un utilisateur
      description: >-
        Insertion idempotente (ON CONFLICT DO NOTHING). Réponse 204 sans corps.
        Aucun contrôle d'existence : une FK inconnue renvoie 500.
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [ Users ]
      summary: Retirer un rôle à un utilisateur
      description: Réponse 204 sans corps, même si l'association n'existe pas.
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Rôle ADMIN manquant (403) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Ressource introuvable (404) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Erreur serveur ou SQL (500) — enveloppe ItemError (message, detail,
        code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    ItemError:
      type: object
      required: [message, detail, code]
      properties:
        message:
          type: string
          description: Message lisible en français, toujours renseigné.
        detail:
          type: string
          description: Précision contextuelle (identifiant, champ, contrainte SQL, cause).
        code:
          type: string
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR) ou SQLState PostgreSQL (ex. 23505).
    UserStatus:
      type: string
      enum: [ ACTIVE, INACTIVE, LOCKED ]
    AppUserCreateRequest:
      type: object
      required: [ username, email, password ]
      properties:
        company_id:
          type: string
          format: uuid
          nullable: true
          description: Identifiant de l'entreprise de rattachement.
        username:
          type: string
          maxLength: 100
          description: Nom d'utilisateur unique.
        email:
          type: string
          format: email
          maxLength: 180
          description: Adresse email unique.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: Mot de passe en clair, haché avant insertion.
        first_name: { type: string, maxLength: 100, nullable: true }
        last_name: { type: string, maxLength: 100, nullable: true }
        phone: { type: string, maxLength: 50, nullable: true }
        status:
          $ref: '#/components/schemas/UserStatus'
          description: ACTIVE par défaut si le champ est absent.
    AppUserUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 180
          nullable: true
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          nullable: true
          description: Nouveau mot de passe, haché avant mise à jour.
        first_name: { type: string, maxLength: 100, nullable: true }
        last_name: { type: string, maxLength: 100, nullable: true }
        phone: { type: string, maxLength: 50, nullable: true }
        status:
          $ref: '#/components/schemas/UserStatus'
    AppUser:
      type: object
      description: >-
        Utilisateur sérialisé en AppUserResponse. password_hash est toujours omis
        et n'est jamais modifiable via l'API.
      required: [ username ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id: { type: string, format: uuid, nullable: true }
        username: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 180, nullable: true }
        first_name: { type: string, maxLength: 100, nullable: true }
        last_name: { type: string, maxLength: 100, nullable: true }
        phone: { type: string, maxLength: 50, nullable: true }
        status: { $ref: '#/components/schemas/UserStatus' }
        last_login_at: { type: string, format: date-time, nullable: true, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
