openapi: 3.0.3
info:
  title: SSSM Authentication — Auth API
  version: 1.0.0
  description: >-
    API d'inscription, de connexion et d'identité courante (module
    a03_authentication/auth), dérivée du contrôleur AuthController. Les routes
    register et login sont publiques ; whoami exige un JWT valide. Toutes les
    erreurs renvoient un Problem Details RFC 9457 (`application/problem+json`) : 400
    (validation Jakarta, corps illisible, identifiants invalides ou compte
    inactif), 401 (JWT absent, invalide ou expiré pour whoami), 404 (utilisateur
    du jeton introuvable ou ressource liée), 500 (erreur serveur). Les erreurs
    de validation sont concaténées dans detail (par exemple « username: … ;
    password: … »).
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
    description: Inscription et connexion
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Créer un compte utilisateur
      description: >-
        Crée un utilisateur ACTIVE, lui attribue le rôle global configuré
        (app.auth.default-role, USER par défaut) s'il existe, puis renvoie un
        AuthResponse dont le token est null. Le username et l'email doivent
        être uniques. Un email ou un username absent est refusé côté service
        (400).
      security: []
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}
      responses:
        '201':
          headers:
            Location:
              description: URI de la ressource créée.
              schema: { type: string, format: uri }
          description: Compte créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400':
          description: >-
            Validation en échec (detail liste les champs), doublon username/email ou champ requis absent côté service ; Problem Details RFC 9457.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Ressource liée introuvable (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Erreur serveur (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Se connecter
      description: >-
        Authentifie par username ou email (insensible à la casse pour l'email).
        Le compte doit être ACTIVE et le mot de passe correspondre au hash
        BCrypt. Met à jour last_login_at et renvoie un JWT signé (1 heure par
        défaut).
      security: []
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400':
          description: >-
            Identifiants invalides ou compte inactif (Problem Details RFC 9457), ou validation
            Jakarta en échec (Problem Details RFC 9457, detail liste les champs).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Ressource liée introuvable (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Erreur serveur (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/auth/whoami:
    get:
      tags: [Auth]
      summary: Obtenir l'utilisateur connecté
      description: >-
        Retourne l'utilisateur associé au JWT : le nom d'utilisateur est lu dans
        le sujet du jeton, puis les informations et les rôles sont rechargés
        depuis la base. Un jeton absent, invalide ou expiré renvoie 401 ; un
        jeton valide dont l'utilisateur n'existe plus renvoie 404.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthUser'}
        '401':
          description: JWT absent, invalide ou expiré — Problem Details RFC 9457.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: >-
            Utilisateur du jeton introuvable — Problem Details RFC 9457 avec un
            message explicite.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Erreur serveur inattendue — Problem Details RFC 9457.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Renouveler un jeton JWT
      description: >-
        Valide le jeton fourni (même expiré) et en émet un nouveau pour le même
        utilisateur et les mêmes rôles. Le compte doit être actif. Le jeton est
        transmis dans le corps : aucun en-tête Authorization n'est requis, ce qui
        permet de renouveler un jeton expiré.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Jeton JWT à renouveler. }
      responses:
        '200':
          description: Nouveau jeton émis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400':
          description: Requête invalide (Problem Details RFC 9457).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: JWT absent, invalide ou expiré (Problem Details RFC 9457).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Utilisateur introuvable (Problem Details RFC 9457).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Erreur serveur (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 100
          description: Obligatoire. Unique.
        email:
          type: string
          format: email
          maxLength: 180
          description: >-
            Validé par @Email mais non requis par Jakarta ; le service exige
            toutefois une valeur non nulle (400 sinon).
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Obligatoire, entre 8 et 128 caractères.
        firstName: {type: string, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 50}
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Username ou email.
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          nullable: true
          description: JWT signé. null à l'inscription, renseigné à la connexion.
        tokenType: {type: string, example: Bearer}
        user: {$ref: '#/components/schemas/AuthUser'}
    AuthUser:
      type: object
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email: {type: string, nullable: true}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        roles:
          type: array
          items: {type: string}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
