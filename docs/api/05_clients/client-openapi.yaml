openapi: 3.0.3
info:
  title: SSSM Clients — Clients API
  version: 1.0.0
  description: >-
    API des clients (module a05_clients/client), dérivée du contrôleur
    ClientController. Toutes les routes exigent un JWT. Toutes les erreurs
    renvoient l'enveloppe {"errors": {message, detail, code}} : 400 (requête
    invalide, JSON illisible ou UUID malformé), 401 (JWT absent, invalide ou
    expiré), 404 (client introuvable lors d'une mise à jour), 500 (erreur
    serveur ou SQL). La lecture d'un identifiant absent renvoie 404 avec l'enveloppe ItemError.
    Pagination : page=1, pageSize=10 par défaut. Le DAO envoie
    payment_terms_days et active explicitement : null viole les contraintes NOT
    NULL, ces champs sont donc requis en pratique.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Clients
    description: Clients
paths:
  /api/clients:
    get:
      tags: [ Clients ]
      summary: Lister les clients
      description: Recherche libre sur name, code et legal_name (ILIKE).
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des clients
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Client' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [ Clients ]
      summary: Créer un client
      description: >-
        Une erreur SQL (contrainte, UUID invalide côté SQL) renvoie 500 avec une
        enveloppe ItemError.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Client' } }
      responses:
        '201':
          description: Client créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/clients/{id}:
    parameters:
      - { $ref: '#/components/parameters/ClientId' }
    get:
      tags: [ Clients ]
      summary: Récupérer un client par identifiant
      description: >-
        Un identifiant inexistant renvoie 404 avec l'enveloppe ItemError.
      responses:
        '200':
          description: Client trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags: [ Clients ]
      summary: Mettre à jour partiellement un client
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        NotFoundException → 404 (enveloppe ItemError). La réponse est l'objet
        envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Client' } }
      responses:
        '200':
          description: Client mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ Clients ]
      summary: Supprimer un client
      description: Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Recherche libre (ILIKE) sur name, code et legal_name.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    ClientId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Ressource introuvable (404) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Erreur serveur ou SQL (500) — enveloppe ItemError (message, detail,
        code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    ItemError:
      type: object
      required: [message, detail, code]
      properties:
        message:
          type: string
          description: Message lisible en français, toujours renseigné.
        detail:
          type: string
          description: Précision contextuelle (identifiant, champ, contrainte SQL, cause).
        code:
          type: string
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR) ou SQLState PostgreSQL (ex. 23505).
    Client:
      type: object
      required: [ company_id, code, name, payment_terms_days, active ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id: { type: string, format: uuid }
        agency_id: { type: string, format: uuid, nullable: true }
        code: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 180 }
        legal_name: { type: string, maxLength: 255, nullable: true }
        client_type: { type: string, maxLength: 80, nullable: true }
        registration_number: { type: string, maxLength: 100, nullable: true }
        tax_number: { type: string, maxLength: 100, nullable: true }
        email: { type: string, format: email, maxLength: 180, nullable: true }
        phone: { type: string, maxLength: 50, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        country: { type: string, maxLength: 100, nullable: true, default: Madagascar }
        payment_terms_days: { type: integer, minimum: 0, default: 30 }
        active: { type: boolean, default: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
