openapi: 3.0.3
info:
  title: SSSM Clients — Client Contacts API
  version: 1.0.0
  description: >-
    API des contacts clients (module a05_clients/client_contact), dérivée du
    contrôleur ClientContactController. Toutes les routes exigent un JWT. Toutes
    les erreurs renvoient un Problem Details RFC 9457 (`application/problem+json`) : 400
    (requête invalide, JSON illisible ou UUID malformé), 401 (JWT absent,
    invalide ou expiré), 404 (contact introuvable lors d'une mise à jour), 500
    (erreur serveur ou SQL). La liste par client n'est pas paginée. is_primary
    est envoyé explicitement par le DAO et doit donc être fourni à la création.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: ClientContacts
    description: Contacts rattachés aux clients
paths:
  /api/v1/client-contacts/client/{clientId}:
    parameters:
      - { $ref: '#/components/parameters/ClientId' }
    get:
      tags: [ ClientContacts ]
      summary: Lister les contacts d'un client
      description: Retourne tous les contacts du client, sans pagination.
      responses:
        '200':
          description: Liste des contacts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ClientContact' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/client-contacts:
    post:
      tags: [ ClientContacts ]
      summary: Créer un contact client
      description: >-
        Une erreur SQL est traduite en 400/409/422/503 avec un Problem Details RFC 9457.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ClientContact' } }
      responses:
        '201':
          headers:
            Location:
              description: URI de la ressource créée.
              schema: { type: string, format: uri }
          description: Contact créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientContact' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/client-contacts/{id}:
    parameters:
      - { $ref: '#/components/parameters/ContactId' }
    get:
      tags: [ ClientContacts ]
      summary: Récupérer un contact par identifiant
      description: >-
        Un identifiant inexistant renvoie 404 avec l'Problem Details RFC 9457.
      responses:
        '200':
          description: Contact trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientContact' }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags: [ ClientContacts ]
      summary: Mettre à jour partiellement un contact
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        NotFoundException → 404 (Problem Details RFC 9457). La réponse est l'objet
        envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ClientContact' } }
      responses:
        '200':
          description: Contact mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientContact' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ ClientContacts ]
      summary: Supprimer un contact
      description: Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable (404) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    ClientContact:
      type: object
      required: [ client_id, first_name, last_name, is_primary ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        client_id: { type: string, format: uuid }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        function: { type: string, maxLength: 100, nullable: true }
        email: { type: string, format: email, maxLength: 180, nullable: true }
        phone: { type: string, maxLength: 50, nullable: true }
        is_primary: { type: boolean, default: false }
