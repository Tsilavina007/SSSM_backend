openapi: 3.0.3
info:
  title: SSSM Personnel — Employee Documents API
  version: 1.0.0
  description: >-
    API des documents d'employés (module a04_personnel/employee_document),
    dérivée du contrôleur EmployeeDocumentController. Toutes les routes exigent
    un JWT. Toutes les erreurs renvoient un Problem Details RFC 9457 (`application/problem+json`) : 400 (requête invalide, JSON illisible ou UUID malformé),
    401 (JWT absent, invalide ou expiré), 404 (document introuvable lors d'une
    mise à jour), 500 (erreur serveur inattendue ; erreurs SQL traduites en 400/409/422/503). La liste par employé n'est pas
    paginée.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: EmployeeDocuments
    description: Documents administratifs des employés
paths:
  /api/v1/employee-documents/employee/{employeeId}:
    parameters:
      - { $ref: '#/components/parameters/EmployeeId' }
    get:
      tags: [ EmployeeDocuments ]
      summary: Lister les documents d'un employé
      description: Retourne tous les documents de l'employé, sans pagination.
      responses:
        '200':
          description: Liste des documents
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EmployeeDocument' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/employee-documents:
    post:
      tags: [ EmployeeDocuments ]
      summary: Créer un document d'employé
      description: >-
        Une erreur SQL est traduite en 400/409/422/503 avec un Problem Details RFC 9457.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EmployeeDocument' } }
      responses:
        '201':
          headers:
            Location:
              description: URI de la ressource créée.
              schema: { type: string, format: uri }
          description: Document créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDocument' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/employee-documents/{id}:
    parameters:
      - { $ref: '#/components/parameters/DocumentId' }
    get:
      tags: [ EmployeeDocuments ]
      summary: Récupérer un document par identifiant
      description: >-
        Un identifiant inexistant renvoie 404 avec l'Problem Details RFC 9457.
      responses:
        '200':
          description: Document trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDocument' }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags: [ EmployeeDocuments ]
      summary: Mettre à jour partiellement un document
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        NotFoundException → 404 (Problem Details RFC 9457). La réponse est l'objet
        envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EmployeeDocument' } }
      responses:
        '200':
          description: Document mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDocument' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ EmployeeDocuments ]
      summary: Supprimer un document
      description: Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable (404) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    EmployeeDocument:
      type: object
      required: [ employee_id, document_type ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        employee_id: { type: string, format: uuid }
        document_type: { type: string, maxLength: 100 }
        document_number: { type: string, maxLength: 150, nullable: true }
        issue_date: { type: string, format: date, nullable: true }
        expiry_date: { type: string, format: date, nullable: true }
        file_url: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time, readOnly: true }
