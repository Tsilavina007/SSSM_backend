openapi: 3.0.3
info:
  title: SSSM Personnel — Employees API
  version: 1.0.0
  description: >-
    API des employés (module a04_personnel/employee), dérivée du contrôleur
    EmployeeController. Toutes les routes exigent un JWT. Toutes les erreurs
    renvoient un Problem Details RFC 9457 (`application/problem+json`) : 400 (requête
    invalide, JSON illisible ou UUID malformé), 401 (JWT absent, invalide ou
    expiré), 404 (employé introuvable lors d'une mise à jour), 500 (erreur
    serveur ou SQL). La lecture d'un identifiant absent renvoie 404 avec l'Problem Details RFC 9457.
    Pagination : page=1, pageSize=10 par défaut. La colonne status est envoyée
    explicitement par le DAO : null provoque une violation NOT NULL, donc status
    est requis en pratique.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Employees
    description: Employés / agents
paths:
  /api/v1/employees:
    get:
      tags: [ Employees ]
      summary: Lister les employés
      description: Recherche libre sur first_name, last_name et employee_number (ILIKE).
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des employés
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Employee' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [ Employees ]
      summary: Créer un employé
      description: >-
        Une violation de contrainte renvoie 409/422 et un UUID invalide 400, avec
        un Problem Details RFC 9457.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Employee' } }
      responses:
        '201':
          headers:
            Location:
              description: URI de la ressource créée.
              schema: { type: string, format: uri }
          description: Employé créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/employees/{id}:
    parameters:
      - { $ref: '#/components/parameters/EmployeeId' }
    get:
      tags: [ Employees ]
      summary: Récupérer un employé par identifiant
      description: >-
        Un identifiant inexistant renvoie 404 avec l'Problem Details RFC 9457.
      responses:
        '200':
          description: Employé trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags: [ Employees ]
      summary: Mettre à jour partiellement un employé
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        NotFoundException → 404 (Problem Details RFC 9457). La réponse est l'objet
        envoyé complété de l'id, et non la ligne relue.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Employee' } }
      responses:
        '200':
          description: Employé mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ Employees ]
      summary: Supprimer un employé
      description: Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Recherche libre (ILIKE) sur first_name, last_name et employee_number.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    EmployeeId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable (404) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    EmployeeStatus:
      type: string
      enum: [ ACTIVE, INACTIVE, SUSPENDED, LEFT ]
    Employee:
      type: object
      required: [ company_id, employee_number, first_name, last_name, status ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id: { type: string, format: uuid }
        agency_id: { type: string, format: uuid, nullable: true }
        user_id: { type: string, format: uuid, nullable: true }
        employee_number: { type: string, maxLength: 80 }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        gender: { type: string, maxLength: 30, nullable: true }
        date_of_birth: { type: string, format: date, nullable: true }
        phone: { type: string, maxLength: 50, nullable: true }
        email: { type: string, format: email, maxLength: 180, nullable: true }
        address: { type: string, nullable: true }
        national_id: { type: string, maxLength: 100, nullable: true }
        hire_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        position: { type: string, maxLength: 100, nullable: true }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
        photo_url: { type: string, nullable: true }
        emergency_contact_name: { type: string, maxLength: 180, nullable: true }
        emergency_contact_phone: { type: string, maxLength: 50, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
