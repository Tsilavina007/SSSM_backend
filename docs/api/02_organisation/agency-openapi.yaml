openapi: 3.0.3
info:
  title: SSSM Organisation — Agencies API
  version: 1.0.0
  description: >-
    API des agences (module a02_organisation/agency), dérivée du contrôleur
    AgencyController. Toutes les routes exigent un JWT (Authorization: Bearer
    …). Toutes les erreurs renvoient l'enveloppe {"errors": {message, detail,
    code}} : 400 (requête invalide, JSON illisible, UUID malformé ou validation),
    401 (JWT absent, invalide ou expiré), 404 (agence introuvable en lecture ou
    mise à jour), 500 (erreur serveur ou SQL). Pagination : page=1, pageSize=10
    par défaut. La validation Jakarta (`@Valid`) s'applique aux corps de création
    et de mise à jour.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Agencies
    description: Agences
paths:
  /api/agency:
    get:
      tags: [ Agencies ]
      summary: Lister les agences
      description: Recherche libre sur name et code (ILIKE).
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des agences
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Agency' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [ Agencies ]
      summary: Créer une agence
      description: >-
        Une erreur SQL (contrainte, UUID invalide côté SQL) renvoie 500 avec une
        enveloppe ItemError.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Agency' } }
      responses:
        '201':
          description: Agence créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agency' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/agency/{agencyId}:
    parameters:
      - { $ref: '#/components/parameters/AgencyId' }
    get:
      tags: [ Agencies ]
      summary: Récupérer une agence par identifiant
      description: >-
        Un identifiant inexistant renvoie 404 avec l'enveloppe ItemError.
      responses:
        '200':
          description: Agence trouvée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agency' }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags: [ Agencies ]
      summary: Mettre à jour partiellement une agence
      description: >-
        Mise à jour partielle (seuls les champs non null sont écrits). Un
        identifiant inconnu lève NotFoundException → 404 (enveloppe ItemError).
        La réponse est l'objet envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Agency' } }
      responses:
        '200':
          description: Agence mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agency' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ Agencies ]
      summary: Supprimer une agence
      description: Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Recherche libre (ILIKE) sur name et code.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    AgencyId:
      name: agencyId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Ressource introuvable (404) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Erreur serveur ou SQL (500) — enveloppe ItemError (message, detail,
        code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    ItemError:
      type: object
      required: [message, detail, code]
      properties:
        message:
          type: string
          description: Message lisible en français, toujours renseigné.
        detail:
          type: string
          description: Précision contextuelle (identifiant, champ, contrainte SQL, cause).
        code:
          type: string
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR) ou SQLState PostgreSQL (ex. 23505).
    Agency:
      type: object
      description: >-
        Agence sérialisée en AgencyResponse. id et horodatages sont générés par
        la base. La validation impose company_id et name à la création ; active
        reçoit true par défaut.
      required: [ company_id, name ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id: { type: string, format: uuid }
        name: { type: string, maxLength: 180 }
        code: { type: string, maxLength: 50, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        phone: { type: string, maxLength: 50, nullable: true }
        email: { type: string, format: email, maxLength: 180, nullable: true }
        tax_number: { type: string, maxLength: 100, nullable: true }
        registration_number: { type: string, maxLength: 100, nullable: true }
        active: { type: boolean, default: true }
        created_at: { type: string, format: date, readOnly: true }
        updated_at: { type: string, format: date, readOnly: true }
