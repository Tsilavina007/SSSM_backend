openapi: 3.0.3
info:
  title: SSSM Organisation — Companies API
  version: 1.0.0
  description: >-
    API des sociétés (module a02_organisation/company), dérivée du contrôleur
    CompanyController. Toutes les routes exigent un JWT (Authorization: Bearer
    …). Toutes les erreurs renvoient un Problem Details RFC 9457 (`application/problem+json`) : 400 (requête invalide, JSON illisible, UUID malformé ou validation),
    401 (JWT absent, invalide ou expiré), 404 (société introuvable en lecture ou
    mise à jour), 500 (erreur serveur inattendue ; erreurs SQL traduites en 400/409/422/503). Pagination : page=1, pageSize=10
    par défaut (aucun maximum). La validation Jakarta (`@Valid`) s'applique aux
    corps de création et de mise à jour.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Companies
    description: Sociétés
paths:
  /api/v1/company:
    get:
      tags: [ Companies ]
      summary: Lister les sociétés
      description: >-
        Recherche libre sur name et legal_name (ILIKE). Sans search, retourne
        toutes les sociétés paginées.
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des sociétés
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Company' } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Companies ]
      summary: Créer une société
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Company' } }
      responses:
        '201':
          headers:
            Location:
              description: URI de la ressource créée.
              schema: { type: string, format: uri }
          description: Société créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/company/{companyId}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
    get:
      tags: [ Companies ]
      summary: Récupérer une société par identifiant
      description: >-
        Un identifiant inexistant renvoie 404 avec l'Problem Details RFC 9457.
      responses:
        '200':
          description: Société trouvée, ou null si absente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [ Companies ]
      summary: Mettre à jour partiellement une société
      description: >-
        Mise à jour partielle : seuls les champs non null sont écrits. Un
        identifiant inconnu renvoie 404 avec l'Problem Details. La réponse
        est l'objet envoyé complété de l'id, et non la ligne relue.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Company' } }
      responses:
        '200':
          description: Société mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [ Companies ]
      summary: Supprimer une société
      description: >-
        Suppression idempotente : un identifiant inexistant ne produit pas
        d'erreur et renvoie également 204.
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Recherche libre (ILIKE) sur name et legal_name.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable (404) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    Company:
      type: object
      description: >-
        Société sérialisée en CompanyResponse. id et les horodatages sont
        générés par la base et ne sont pas modifiables par le client.
      required: [ name ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 180 }
        legal_name: { type: string, maxLength: 255, nullable: true }
        registration_number: { type: string, maxLength: 100, nullable: true }
        tax_number: { type: string, maxLength: 100, nullable: true }
        email: { type: string, format: email, maxLength: 180, nullable: true }
        phone: { type: string, maxLength: 50, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        country: { type: string, maxLength: 100, nullable: true, default: Madagascar }
        logo_url: { type: string, nullable: true }
        currency_code: { type: string, minLength: 3, maxLength: 3, default: MGA }
        created_at: { type: string, format: date, readOnly: true }
        updated_at: { type: string, format: date, readOnly: true }
