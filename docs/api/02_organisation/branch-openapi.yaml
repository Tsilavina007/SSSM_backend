openapi: 3.0.3
info:
  title: SSSM Organisation — Branches API
  version: 1.0.0
  description: >-
    API des succursales (module a02_organisation/branch), dérivée du contrôleur
    BranchController. Toutes les routes exigent un JWT (Authorization: Bearer
    …). Toutes les erreurs renvoient un Problem Details RFC 9457 (`application/problem+json`) : 400 (requête invalide, JSON illisible, UUID malformé ou validation),
    401 (JWT absent, invalide ou expiré), 404 (branche ou agence introuvable),
    500 (erreur serveur inattendue ; erreurs SQL traduites en 400/409/422/503). Pagination : page=1, pageSize=10 par défaut. La
    validation Jakarta (`@Valid`) s'applique aux corps de création et de mise à
    jour ; company_id, agence_id et name sont obligatoires à la création.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Branches
    description: Succursales
paths:
  /api/v1/branch:
    get:
      tags: [ Branches ]
      summary: Lister les succursales
      description: Recherche libre sur name et code (ILIKE).
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des succursales
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Branch' } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Branches ]
      summary: Créer une succursale
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/BranchCreate' } }
      responses:
        '201':
          headers:
            Location:
              description: URI de la ressource créée.
              schema: { type: string, format: uri }
          description: Succursale créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/branch/{branchId}:
    parameters:
      - { $ref: '#/components/parameters/BranchId' }
    get:
      tags: [ Branches ]
      summary: Récupérer une succursale par identifiant
      description: >-
        Un identifiant inexistant provoque une NoSuchElementException → 404
        (Problem Details RFC 9457). La réponse inclut l'agence complète dans le champ
        agence.
      responses:
        '200':
          description: Succursale trouvée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [ Branches ]
      summary: Mettre à jour partiellement une succursale
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu renvoie
        404 avec l'Problem Details.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/BranchUpdate' } }
      responses:
        '200':
          description: Succursale mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [ Branches ]
      summary: Supprimer une succursale
      description: >-
        Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Recherche libre (ILIKE) sur name et code.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    BranchId:
      name: branchId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable (404) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    SiteStatus:
      type: string
      enum: [ ACTIVE, INACTIVE ]
    Agency:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        tax_number: { type: string, nullable: true }
        registration_number: { type: string, nullable: true }
        active: { type: boolean }
        created_at: { type: string, format: date }
        updated_at: { type: string, format: date }
    Branch:
      type: object
      description: >-
        Succursale sérialisée avec son agence complète. La base exige
        company_id, agence_id et name.
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        agence: { $ref: '#/components/schemas/Agency' }
        name: { type: string }
        code: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/SiteStatus' }
        created_at: { type: string, format: date }
        updated_at: { type: string, format: date }
    BranchCreate:
      type: object
      description: >-
        Corps de création (BranchCreateRequest). Tous les champs sont requis par
        la base ou le DAO, status compris (aucun défaut appliqué).
      required: [ company_id, agence_id, name, status ]
      properties:
        company_id: { type: string, format: uuid }
        agence_id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        code: { type: string, maxLength: 50, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        phone: { type: string, maxLength: 50, nullable: true }
        email: { type: string, format: email, maxLength: 180, nullable: true }
        status: { $ref: '#/components/schemas/SiteStatus' }
    BranchUpdate:
      type: object
      description: Tous les champs sont facultatifs (mise à jour partielle).
      properties:
        company_id: { type: string, format: uuid }
        agence_id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        code: { type: string, maxLength: 50 }
        address: { type: string }
        city: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 50 }
        email: { type: string, format: email, maxLength: 180 }
        status: { $ref: '#/components/schemas/SiteStatus' }
