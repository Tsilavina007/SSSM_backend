openapi: 3.0.3
info:
  title: SSSM Sites — Sites API
  version: 1.0.0
  description: >-
    API des sites (module a06_sites/site), dérivée du contrôleur SiteController.
    Toutes les routes exigent un JWT. Toutes les erreurs renvoient un Problem Details RFC 9457 (`application/problem+json`) : 400 (requête invalide, JSON illisible,
    UUID malformé ou validation), 401 (JWT absent, invalide ou expiré), 404 (site
    introuvable en lecture ou mise à jour), 500 (erreur serveur inattendue ; erreurs SQL traduites en 400/409/422/503).
    Pagination : page=1, pageSize=10 par défaut. Le statut est facultatif à la
    création : le DAO applique ACTIVE si null. La validation Jakarta (`@Valid`)
    s'applique aux corps de création et de mise à jour.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Sites
    description: Sites surveillés
paths:
  /api/v1/sites:
    get:
      tags: [ Sites ]
      summary: Lister les sites
      description: Recherche libre sur name, code et city (ILIKE).
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des sites
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Site' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [ Sites ]
      summary: Créer un site
      description: >-
        Une violation de contrainte renvoie 409/422 et un UUID invalide 400, avec
        un Problem Details RFC 9457.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Site' } }
      responses:
        '201':
          headers:
            Location:
              description: URI de la ressource créée.
              schema: { type: string, format: uri }
          description: Site créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sites/{id}:
    parameters:
      - { $ref: '#/components/parameters/SiteId' }
    get:
      tags: [ Sites ]
      summary: Récupérer un site par identifiant
      description: >-
        Un identifiant inexistant renvoie 404 avec l'Problem Details RFC 9457.
      responses:
        '200':
          description: Site trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags: [ Sites ]
      summary: Mettre à jour partiellement un site
      description: >-
        Seuls les champs non null sont écrits (impossible de remettre un champ à
        null). Un identifiant inconnu lève NotFoundException → 404 (Problem Details RFC 9457). La réponse est l'objet envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Site' } }
      responses:
        '200':
          description: Site mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ Sites ]
      summary: Supprimer un site
      description: Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Recherche libre (ILIKE) sur name, code et city.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    SiteId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable (404) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    SiteStatus:
      type: string
      enum: [ ACTIVE, INACTIVE ]
    Site:
      type: object
      required: [ company_id, name ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid, nullable: true }
        branch_id: { type: string, format: uuid, nullable: true }
        name: { type: string, maxLength: 180 }
        code: { type: string, maxLength: 80, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        latitude: { type: number, multipleOf: 1e-7, nullable: true }
        longitude: { type: number, multipleOf: 1e-7, nullable: true }
        status: { $ref: '#/components/schemas/SiteStatus' }
        access_instructions: { type: string, nullable: true }
        risk_level: { type: string, maxLength: 30, nullable: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
