openapi: 3.0.3
info:
  title: SSSM Sites — Post Requirements API
  version: 1.0.0
  description: >-
    API des exigences de poste (module a06_sites/post_requirement), dérivée du
    contrôleur PostRequirementController. Toutes les routes exigent un JWT.
    Toutes les erreurs renvoient un Problem Details RFC 9457 (`application/problem+json`)
    : 400 (requête invalide, JSON illisible ou UUID malformé), 401 (JWT absent,
    invalide ou expiré), 404 (exigence introuvable lors d'une mise à jour), 500
    (erreur serveur ou SQL). La liste par poste n'est pas paginée et est triée
    par requirement.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: PostRequirements
    description: Exigences rattachées aux postes de sécurité
paths:
  /api/v1/post-requirements/post/{postId}:
    parameters:
      - { $ref: '#/components/parameters/PostId' }
    get:
      tags: [ PostRequirements ]
      summary: Lister les exigences d'un poste
      description: Retourne toutes les exigences du poste, triées par requirement.
      responses:
        '200':
          description: Liste des exigences
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PostRequirement' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/post-requirements:
    post:
      tags: [ PostRequirements ]
      summary: Créer une exigence de poste
      description: >-
        Une erreur SQL est traduite en 400/409/422/503 avec un Problem Details RFC 9457.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PostRequirement' } }
      responses:
        '201':
          headers:
            Location:
              description: URI de la ressource créée.
              schema: { type: string, format: uri }
          description: Exigence créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostRequirement' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/post-requirements/{id}:
    parameters:
      - { $ref: '#/components/parameters/RequirementId' }
    get:
      tags: [ PostRequirements ]
      summary: Récupérer une exigence par identifiant
      description: >-
        Un identifiant inexistant renvoie 404 avec l'Problem Details RFC 9457.
      responses:
        '200':
          description: Exigence trouvée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostRequirement' }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags: [ PostRequirements ]
      summary: Mettre à jour partiellement une exigence
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        NotFoundException → 404 (Problem Details RFC 9457). La réponse est l'objet
        envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PostRequirement' } }
      responses:
        '200':
          description: Exigence mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostRequirement' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ PostRequirements ]
      summary: Supprimer une exigence
      description: Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequirementId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable (404) — Problem Details RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Erreur serveur inattendue (500) — Problem Details RFC 9457 (message, detail,
        code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        Réponse d'erreur au format Problem Details (RFC 9457), servie en
        application/problem+json. Le type reste about:blank tant qu'aucun
        catalogue d'URI public n'est publié.
      required: [ type, title, status, detail, instance, code, traceId, timestamp ]
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string, description: Résumé stable du type d'erreur. }
        status: { type: integer, description: Code HTTP répété dans le corps. }
        detail: { type: string, description: Précision contextuelle non technique. }
        instance: { type: string, format: uri, description: URI de la requête en échec. }
        code:
          type: string
          description: >-
            Code applicatif stable (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR).
        traceId: { type: string, format: uuid, description: Identifiant de corrélation. }
        timestamp: { type: string, format: date-time, description: Horodatage UTC de l'erreur. }
        errors:
          type: array
          description: Champs en erreur, présent uniquement pour une validation.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    PostRequirement:
      type: object
      required: [ post_id, requirement ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        post_id: { type: string, format: uuid }
        requirement: { type: string, maxLength: 180 }
