spring.application.name=sssm_backend
# Valeurs de développement. Le profil prod (application-prod.properties) exige JWT_SECRET.
app.jwt.secret=${JWT_SECRET:development-only-jwt-secret-change-in-production-32}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
app.jwt.issuer=${JWT_ISSUER:sssm-api}
app.jwt.audience=${JWT_AUDIENCE:sssm-client}
app.auth.default-role=${AUTH_DEFAULT_ROLE:USER}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
# Limitation de debit des resolutions de QR code (par utilisateur et par entreprise).
app.qr.scan.max-per-minute=${QR_SCAN_MAX_PER_MINUTE:120}
app.qr.scan.window-seconds=${QR_SCAN_WINDOW_SECONDS:60}


# Valeurs de développement. Le profil prod exige DB_URL, DB_USER et DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sssm_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool HikariCP : tailles et délais surchargeables par l'environnement de déploiement.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

server.port=${SERVER_PORT:8080}

# Contrat HTTP : les dates sont sérialisées en ISO-8601, en UTC.
spring.jackson.time-zone=UTC
