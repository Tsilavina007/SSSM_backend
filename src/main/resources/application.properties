spring.application.name=sssm_backend
# Valeurs de développement. Le profil prod (application-prod.properties) exige JWT_SECRET.
app.jwt.secret=${JWT_SECRET:development-only-jwt-secret-change-in-production-32}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.auth.default-role=${AUTH_DEFAULT_ROLE:USER}


# Valeurs de développement. Le profil prod exige DB_URL, DB_USER et DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sssm_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${SERVER_PORT:8080}
