openapi: 3.0.3
info:
  title: SSSM Organisation API
  version: 1.0.0
  description: |
    API de gestion des sociétés, agences et branches du SSSM.
    Les identifiants sont des UUID et les données sont stockées dans le schéma
    PostgreSQL `security`.
servers:
  - url: http://localhost:8080
    description: Serveur local
tags:
  - name: Companies
    description: Gestion des sociétés
  - name: Agencies
    description: Gestion des agences
  - name: Branches
    description: Gestion des branches
paths:
  /api/company:
    get:
      tags: [Companies]
      summary: Lister les sociétés
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Liste paginée des sociétés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
    post:
      tags: [Companies]
      summary: Créer une société
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
      responses:
        '200':
          description: Société créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
  /api/company/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Companies]
      summary: Récupérer une société
      responses:
        '200':
          description: Société trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Companies]
      summary: Modifier une société
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdate'
      responses:
        '200':
          description: Société modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
    delete:
      tags: [Companies]
      summary: Supprimer une société
      responses:
        '200':
          description: Société supprimée

  /api/agency:
    get:
      tags: [Agencies]
      summary: Lister les agences
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Liste paginée des agences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agency'
    post:
      tags: [Agencies]
      summary: Créer une agence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyCreate'
      responses:
        '200':
          description: Agence créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
  /api/agency/{agencyId}:
    parameters:
      - $ref: '#/components/parameters/AgencyId'
    get:
      tags: [Agencies]
      summary: Récupérer une agence
      responses:
        '200':
          description: Agence trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Agencies]
      summary: Modifier une agence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyUpdate'
      responses:
        '200':
          description: Agence modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
    delete:
      tags: [Agencies]
      summary: Supprimer une agence
      responses:
        '200':
          description: Agence supprimée

  /api/branch:
    get:
      tags: [Branches]
      summary: Lister les branches
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Liste paginée des branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
    post:
      tags: [Branches]
      summary: Créer une branche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreate'
      responses:
        '200':
          description: Branche créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
  /api/branch/{branchId}:
    parameters:
      - $ref: '#/components/parameters/BranchId'
    get:
      tags: [Branches]
      summary: Récupérer une branche
      responses:
        '200':
          description: Branche trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Branches]
      summary: Modifier une branche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchUpdate'
      responses:
        '200':
          description: Branche modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
    delete:
      tags: [Branches]
      summary: Supprimer une branche
      responses:
        '200':
          description: Branche supprimée

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 10
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: Recherche par nom et code selon la ressource.
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgencyId:
      name: agencyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Ressource introuvable
  schemas:
    Company:
      allOf:
        - $ref: '#/components/schemas/CompanyCreate'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    CompanyCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 180}
        legal_name: {type: string, maxLength: 255}
        registration_number: {type: string, maxLength: 100}
        tax_number: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 180}
        phone: {type: string, maxLength: 50}
        address: {type: string}
        city: {type: string, maxLength: 100}
        country: {type: string, maxLength: 100, default: Madagascar}
        logo_url: {type: string, format: uri}
        currency_code: {type: string, minLength: 3, maxLength: 3, default: MGA}
    CompanyUpdate:
      type: object
      description: Tous les champs sont facultatifs pour une modification partielle.
      properties:
        name: {type: string, maxLength: 180}
        legal_name: {type: string, maxLength: 255}
        registration_number: {type: string, maxLength: 100}
        tax_number: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 180}
        phone: {type: string, maxLength: 50}
        address: {type: string}
        city: {type: string, maxLength: 100}
        country: {type: string, maxLength: 100}
        logo_url: {type: string, format: uri}
        currency_code: {type: string, minLength: 3, maxLength: 3}

    Agency:
      allOf:
        - $ref: '#/components/schemas/AgencyCreate'
        - type: object
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    AgencyCreate:
      type: object
      required: [company_id, name]
      properties:
        company_id: {type: string, format: uuid}
        name: {type: string, maxLength: 180}
        code: {type: string, maxLength: 50}
        address: {type: string}
        city: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 50}
        email: {type: string, format: email, maxLength: 180}
        tax_number: {type: string, maxLength: 100}
        registration_number: {type: string, maxLength: 100}
        active: {type: boolean, default: true}
    AgencyUpdate:
      type: object
      properties:
        company_id: {type: string, format: uuid}
        name: {type: string, maxLength: 180}
        code: {type: string, maxLength: 50}
        address: {type: string}
        city: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 50}
        email: {type: string, format: email, maxLength: 180}
        tax_number: {type: string, maxLength: 100}
        registration_number: {type: string, maxLength: 100}
        active: {type: boolean}

    Branch:
      allOf:
        - $ref: '#/components/schemas/BranchCreate'
        - type: object
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    BranchCreate:
      type: object
      required: [company_id, agence_id, name]
      properties:
        company_id: {type: string, format: uuid}
        agence_id: {type: string, format: uuid}
        name: {type: string, maxLength: 150}
        code: {type: string, maxLength: 50}
        address: {type: string}
        city: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 50}
        email: {type: string, format: email, maxLength: 180}
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
    BranchUpdate:
      type: object
      properties:
        company_id: {type: string, format: uuid}
        agence_id: {type: string, format: uuid}
        name: {type: string, maxLength: 150}
        code: {type: string, maxLength: 50}
        address: {type: string}
        city: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 50}
        email: {type: string, format: email, maxLength: 180}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
