openapi: 3.0.3
info:
  title: SSSM Clients API
  version: 1.0.0
  description: API de gestion des clients et de leurs contacts.
servers:
  - url: http://localhost:8080
    description: Serveur local
tags:
  - name: Clients
  - name: Client Contacts
paths:
  /api/clients:
    get:
      tags: [Clients]
      summary: Lister les clients
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Liste paginée des clients
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Client'}
    post:
      tags: [Clients]
      summary: Créer un client
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientCreate'}
      responses:
        '200':
          description: Client créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
  /api/clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Clients]
      summary: Récupérer un client
      responses:
        '200':
          description: Client trouvé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Clients]
      summary: Modifier un client
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientUpdate'}
      responses:
        '200':
          description: Client modifié
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
    delete:
      tags: [Clients]
      summary: Supprimer un client
      responses:
        '200': {description: Client supprimé}
  /api/client-contacts:
    post:
      tags: [Client Contacts]
      summary: Créer un contact client
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientContactCreate'}
      responses:
        '200':
          description: Contact créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientContact'}
  /api/client-contacts/client/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Client Contacts]
      summary: Lister les contacts d’un client
      responses:
        '200':
          description: Contacts du client
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ClientContact'}
  /api/client-contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      tags: [Client Contacts]
      summary: Récupérer un contact
      responses:
        '200':
          description: Contact trouvé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientContact'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Client Contacts]
      summary: Modifier un contact
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientContactUpdate'}
      responses:
        '200':
          description: Contact modifié
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientContact'}
    delete:
      tags: [Client Contacts]
      summary: Supprimer un contact
      responses:
        '200': {description: Contact supprimé}
components:
  parameters:
    ClientId:
      name: clientId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ContactId:
      name: contactId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Search:
      name: search
      in: query
      schema: {type: string}
      description: Recherche par code, nom ou raison sociale.
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, default: 10}
  responses:
    NotFound:
      description: Ressource introuvable
  schemas:
    Client:
      allOf:
        - $ref: '#/components/schemas/ClientCreate'
        - type: object
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    ClientCreate:
      type: object
      required: [company_id, code, name]
      properties:
        company_id: {type: string, format: uuid}
        agency_id: {type: string, format: uuid, nullable: true}
        code: {type: string, maxLength: 80}
        name: {type: string, maxLength: 180}
        legal_name: {type: string, maxLength: 255}
        client_type: {type: string, maxLength: 80}
        registration_number: {type: string, maxLength: 100}
        tax_number: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 180}
        phone: {type: string, maxLength: 50}
        address: {type: string}
        city: {type: string, maxLength: 100}
        country: {type: string, maxLength: 100, default: Madagascar}
        payment_terms_days: {type: integer, minimum: 0, default: 30}
        active: {type: boolean, default: true}
    ClientUpdate:
      type: object
      properties:
        company_id: {type: string, format: uuid}
        agency_id: {type: string, format: uuid, nullable: true}
        code: {type: string, maxLength: 80}
        name: {type: string, maxLength: 180}
        legal_name: {type: string, maxLength: 255}
        client_type: {type: string, maxLength: 80}
        registration_number: {type: string, maxLength: 100}
        tax_number: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 180}
        phone: {type: string, maxLength: 50}
        address: {type: string}
        city: {type: string, maxLength: 100}
        country: {type: string, maxLength: 100}
        payment_terms_days: {type: integer, minimum: 0}
        active: {type: boolean}
    ClientContact:
      allOf:
        - $ref: '#/components/schemas/ClientContactCreate'
        - type: object
          properties:
            id: {type: string, format: uuid}
    ClientContactCreate:
      type: object
      required: [client_id, first_name, last_name]
      properties:
        client_id: {type: string, format: uuid}
        first_name: {type: string, maxLength: 100}
        last_name: {type: string, maxLength: 100}
        function: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 180}
        phone: {type: string, maxLength: 50}
        is_primary: {type: boolean, default: false}
    ClientContactUpdate:
      type: object
      properties:
        first_name: {type: string, maxLength: 100}
        last_name: {type: string, maxLength: 100}
        function: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 180}
        phone: {type: string, maxLength: 50}
        is_primary: {type: boolean}
