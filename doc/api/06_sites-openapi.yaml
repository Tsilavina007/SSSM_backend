openapi: 3.0.3
info:
  title: SSSM Sites API
  version: 1.0.0
  description: API de gestion des sites, postes de sécurité et exigences de poste.
servers:
  - url: http://localhost:8080
tags:
  - name: Sites
  - name: Security Posts
  - name: Post Requirements
paths:
  /api/sites:
    get:
      tags: [Sites]
      summary: Lister les sites
      parameters:
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Liste des sites
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Site'}}
    post:
      tags: [Sites]
      summary: Créer un site
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/SiteCreate'}}
      responses:
        '200': {description: Site créé, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}
  /api/sites/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Sites]
      summary: Récupérer un site
      responses:
        '200': {description: Site trouvé, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Sites]
      summary: Modifier un site
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/SiteUpdate'}}
      responses:
        '200': {description: Site modifié, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}
    delete:
      tags: [Sites]
      summary: Supprimer un site
      responses:
        '200': {description: Site supprimé}
  /api/security-posts/site/{siteId}:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      tags: [Security Posts]
      summary: Lister les postes d'un site
      responses:
        '200':
          description: Postes du site
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SecurityPost'}}
  /api/security-posts:
    post:
      tags: [Security Posts]
      summary: Créer un poste de sécurité
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/SecurityPostCreate'}}
      responses:
        '200': {description: Poste créé, content: {application/json: {schema: {$ref: '#/components/schemas/SecurityPost'}}}}
  /api/security-posts/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Security Posts]
      summary: Récupérer un poste
      responses:
        '200': {description: Poste trouvé, content: {application/json: {schema: {$ref: '#/components/schemas/SecurityPost'}}}}
    patch:
      tags: [Security Posts]
      summary: Modifier un poste
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/SecurityPostCreate'}}
      responses:
        '200': {description: Poste modifié}
    delete:
      tags: [Security Posts]
      summary: Supprimer un poste
      responses:
        '200': {description: Poste supprimé}
  /api/post-requirements/post/{postId}:
    parameters: [{$ref: '#/components/parameters/PostId'}]
    get:
      tags: [Post Requirements]
      summary: Lister les exigences d'un poste
      responses:
        '200':
          description: Exigences du poste
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PostRequirement'}}
  /api/post-requirements:
    post:
      tags: [Post Requirements]
      summary: Créer une exigence
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PostRequirementCreate'}}
      responses:
        '200': {description: Exigence créée, content: {application/json: {schema: {$ref: '#/components/schemas/PostRequirement'}}}}
  /api/post-requirements/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Post Requirements]
      summary: Récupérer une exigence
      responses:
        '200': {description: Exigence trouvée, content: {application/json: {schema: {$ref: '#/components/schemas/PostRequirement'}}}}
    patch:
      tags: [Post Requirements]
      summary: Modifier une exigence
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PostRequirementUpdate'}}
      responses:
        '200': {description: Exigence modifiée}
    delete:
      tags: [Post Requirements]
      summary: Supprimer une exigence
      responses:
        '200': {description: Exigence supprimée}
components:
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    SiteId: {name: siteId, in: path, required: true, schema: {type: string, format: uuid}}
    PostId: {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
    Search: {name: search, in: query, schema: {type: string}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, default: 10}}
  responses:
    NotFound: {description: Ressource introuvable}
  schemas:
    Site:
      allOf:
        - {$ref: '#/components/schemas/SiteCreate'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    SiteCreate:
      type: object
      required: [company_id, name]
      properties:
        company_id: {type: string, format: uuid}
        client_id: {type: string, format: uuid, nullable: true}
        branch_id: {type: string, format: uuid, nullable: true}
        name: {type: string, maxLength: 180}
        code: {type: string, maxLength: 80}
        address: {type: string}
        city: {type: string, maxLength: 100}
        latitude: {type: number, format: double, minimum: -90, maximum: 90}
        longitude: {type: number, format: double, minimum: -180, maximum: 180}
        status: {type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE}
        access_instructions: {type: string}
        risk_level: {type: string, maxLength: 30}
    SiteUpdate:
      allOf:
        - {$ref: '#/components/schemas/SiteCreate'}
    SecurityPost:
      allOf:
        - {$ref: '#/components/schemas/SecurityPostCreate'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
    SecurityPostCreate:
      type: object
      required: [site_id, name]
      properties:
        site_id: {type: string, format: uuid}
        name: {type: string, maxLength: 180}
        code: {type: string, maxLength: 80}
        description: {type: string}
        required_agents: {type: integer, minimum: 1, default: 1}
        start_time: {type: string, format: time}
        end_time: {type: string, format: time}
        status: {type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE}
    PostRequirement:
      allOf:
        - {$ref: '#/components/schemas/PostRequirementCreate'}
        - type: object
          properties:
            id: {type: string, format: uuid}
    PostRequirementCreate:
      type: object
      required: [post_id, requirement]
      properties:
        post_id: {type: string, format: uuid}
        requirement: {type: string, maxLength: 180}
    PostRequirementUpdate:
      type: object
      required: [requirement]
      properties:
        requirement: {type: string, maxLength: 180}
