openapi: 3.0.3
info:
  title: SSSM Authentication — Users API
  version: 1.0.0
  description: >-
    API des utilisateurs (module a03_authentication/user), dérivée du
    contrôleur AppUserController. Toutes les routes exigent le rôle ADMIN
    (hasRole("ADMIN")), en plus du JWT. Erreurs : enveloppe {"errors":
    {message, detail, code}} pour ClientException (400), NotFoundException
    (404) et ServerException (500). Pagination : page=1, pageSize=10 par
    défaut. Le champ password_hash est annoté @JsonIgnore : il n'est jamais
    exposé ni accepté en entrée. En conséquence, POST /api/users ne peut pas
    fournir de mot de passe et échoue sur la contrainte NOT NULL
    (password_hash) → 500 ; utiliser /api/auth/register pour créer un compte.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Users
    description: Utilisateurs (ADMIN)
paths:
  /api/users:
    get:
      tags: [Users]
      summary: Lister les utilisateurs
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Liste paginée des utilisateurs
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AppUser'}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Users]
      summary: Créer un utilisateur (non fonctionnel sans password_hash)
      description: >-
        Le corps est lié à l'entité AppUser. password_hash étant @JsonIgnore,
        aucune valeur ne peut être fournie : l'insertion viole la contrainte
        NOT NULL et renvoie 500. Les autres champs sont insérés tels quels.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/AppUser'}}
      responses:
        '200':
          description: Utilisateur créé (cas théorique si password_hash était renseigné)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppUser'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/users/{id}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      tags: [Users]
      summary: Récupérer un utilisateur par identifiant
      description: Un identifiant inconnu renvoie 404 avec l'enveloppe d'erreur.
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppUser'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Users]
      summary: Mettre à jour partiellement un utilisateur
      description: >-
        Seuls les champs non null sont écrits. La réponse est l'objet envoyé
        (avec id), et non la ligne relue : les champs omis sont donc absents
        ou null dans la réponse. Un identifiant inconnu renvoie 404.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/AppUser'}}
      responses:
        '200':
          description: Utilisateur mis à jour (objet d'entrée complété de l'id)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppUser'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Users]
      summary: Supprimer un utilisateur
      description: Réponse 200 avec corps vide ; aucune erreur si l'identifiant est inconnu.
      responses:
        '200':
          description: Suppression effectuée (corps vide)
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/users/{userId}/roles/{roleId}:
    parameters:
      - {$ref: '#/components/parameters/UserIdPath'}
      - {$ref: '#/components/parameters/RoleId'}
    post:
      tags: [Users]
      summary: Attribuer un rôle à un utilisateur
      description: >-
        Insertion idempotente (ON CONFLICT DO NOTHING). Réponse 200 avec corps
        vide. Aucun contrôle d'existence : une FK inconnue renvoie 500.
      responses:
        '200':
          description: Rôle attribué (corps vide)
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Users]
      summary: Retirer un rôle à un utilisateur
      description: Réponse 200 avec corps vide, même si l'association n'existe pas.
      responses:
        '200':
          description: Rôle retiré (corps vide)
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 10}
    UserId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RoleId:
      name: roleId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Requête malformée ou ClientException (enveloppe).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: JWT absent ou rôle ADMIN manquant (403 Spring Security).
    NotFound:
      description: Utilisateur introuvable (enveloppe d'erreur).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ServerError:
      description: Erreur serveur (enveloppe d'erreur).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: {$ref: '#/components/schemas/Error'}
    Error:
      type: object
      properties:
        message: {type: string, nullable: true}
        detail: {type: string, nullable: true}
        code: {type: string, nullable: true, description: SQLState PostgreSQL (ex. 23505).}
    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE, LOCKED]
    AppUser:
      type: object
      description: >-
        Utilisateur sérialisé (entité AppUser). password_hash est toujours
        omis (@JsonIgnore) et ne peut pas être fourni en entrée.
      required: [username]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        company_id: {type: string, format: uuid, nullable: true}
        username: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 180, nullable: true}
        first_name: {type: string, maxLength: 100, nullable: true}
        last_name: {type: string, maxLength: 100, nullable: true}
        phone: {type: string, maxLength: 50, nullable: true}
        status: {$ref: '#/components/schemas/UserStatus'}
        last_login_at: {type: string, format: date-time, nullable: true, readOnly: true}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
