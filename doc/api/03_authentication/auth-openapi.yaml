openapi: 3.0.3
info:
  title: SSSM Authentication — Auth API
  version: 1.0.0
  description: >-
    API d'inscription et de connexion (module a03_authentication/auth), dérivée
    du contrôleur AuthController. Ces deux routes sont publiques (permitAll) :
    aucun JWT n'est requis. Toutes les erreurs renvoient l'enveloppe
    {"errors": {message, detail, code}} : 400 (validation Jakarta, corps
    illisible, identifiants invalides ou compte inactif), 404 (ressource liée
    introuvable), 500 (erreur serveur). Les erreurs de validation sont
    concaténées dans detail (par exemple « username: … ; password: … »).
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
    description: Inscription et connexion
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Créer un compte utilisateur
      description: >-
        Crée un utilisateur ACTIVE, lui attribue le rôle global configuré
        (app.auth.default-role, USER par défaut) s'il existe, puis renvoie un
        AuthResponse dont le token est null. Le username et l'email doivent
        être uniques. Un email ou un username absent est refusé côté service
        (400).
      security: []
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400':
          description: >-
            Validation en échec (detail liste les champs), doublon username/email ou champ requis absent côté service ; enveloppe ItemError.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Ressource liée introuvable (enveloppe d'erreur).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '500':
          description: Erreur serveur (enveloppe d'erreur).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Se connecter
      description: >-
        Authentifie par username ou email (insensible à la casse pour l'email).
        Le compte doit être ACTIVE et le mot de passe correspondre au hash
        BCrypt. Met à jour last_login_at et renvoie un JWT signé (1 heure par
        défaut).
      security: []
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400':
          description: >-
            Identifiants invalides ou compte inactif (enveloppe), ou validation
            Jakarta en échec (enveloppe ItemError, detail liste les champs).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '404':
          description: Ressource liée introuvable (enveloppe d'erreur).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '500':
          description: Erreur serveur (enveloppe d'erreur).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
components:
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: {$ref: '#/components/schemas/ItemError'}
    ItemError:
      type: object
      required: [message, detail, code]
      properties:
        message:
          type: string
          description: Message lisible en français, toujours renseigné.
        detail:
          type: string
          description: Précision contextuelle (identifiant, champ, contrainte SQL, cause).
        code:
          type: string
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR, INVALID_REQUEST_BODY,
            NOT_FOUND, CLIENT_ERROR, SERVER_ERROR, UNAUTHORIZED, FORBIDDEN,
            METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, INTERNAL_ERROR) ou
            SQLState PostgreSQL (ex. 23505).
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 100
          description: Obligatoire. Unique.
        email:
          type: string
          format: email
          maxLength: 180
          description: >-
            Validé par @Email mais non requis par Jakarta ; le service exige
            toutefois une valeur non nulle (400 sinon).
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Obligatoire, entre 8 et 128 caractères.
        firstName: {type: string, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 50}
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Username ou email.
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          nullable: true
          description: JWT signé. null à l'inscription, renseigné à la connexion.
        tokenType: {type: string, example: Bearer}
        user: {$ref: '#/components/schemas/AuthUser'}
    AuthUser:
      type: object
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email: {type: string, nullable: true}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        roles:
          type: array
          items: {type: string}
