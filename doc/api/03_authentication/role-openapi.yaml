openapi: 3.0.3
info:
  title: SSSM Authentication — Roles API
  version: 1.0.0
  description: >-
    API des rôles (module a03_authentication/role), dérivée du contrôleur
    RoleController. Toutes les routes exigent le rôle ADMIN. Toutes les erreurs
    renvoient l'enveloppe {"errors": {message, detail, code}} : 400 (requête
    invalide, JSON illisible ou UUID malformé), 401 (JWT absent, invalide ou
    expiré), 403 (rôle ADMIN manquant), 404 (rôle introuvable lors d'une mise à
    jour), 500 (erreur serveur ou SQL). Pagination : page=1, pageSize=10 par
    défaut. Attention : RoleDAO.create appelle UUID.fromString(company_id) sans
    garde ; un company_id null (rôle global) provoque une erreur 500.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Roles
    description: Rôles et permissions associées (ADMIN)
paths:
  /api/roles:
    get:
      tags: [ Roles ]
      summary: Lister les rôles
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des rôles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Role' } }
        '403':
          $ref: '#/components/responses/Forbidden'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [ Roles ]
      summary: Créer un rôle
      description: >-
        company_id est obligatoire en pratique (UUID.fromString sans garde). Une erreur SQL renvoie 500 avec une enveloppe ItemError.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Role' } }
      responses:
        '201':
          description: Rôle créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/roles/{id}:
    parameters:
      - { $ref: '#/components/parameters/RoleId' }
    get:
      tags: [ Roles ]
      summary: Récupérer un rôle par identifiant
      description: >-
        Un identifiant inexistant renvoie 404 avec l'enveloppe ItemError.
      responses:
        '200':
          description: Rôle trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [ Roles ]
      summary: Mettre à jour partiellement un rôle
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        NotFoundException → 404 (enveloppe ItemError). La réponse est l'objet
        envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Role' } }
      responses:
        '200':
          description: Rôle mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ Roles ]
      summary: Supprimer un rôle
      description: Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/roles/{roleId}/permissions/{permissionId}:
    parameters:
      - { $ref: '#/components/parameters/RoleIdPath' }
      - { $ref: '#/components/parameters/PermissionId' }
    post:
      tags: [ Roles ]
      summary: Attribuer une permission à un rôle
      description: Insertion idempotente (ON CONFLICT DO NOTHING). Réponse 204 sans
        corps.
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [ Roles ]
      summary: Retirer une permission à un rôle
      description: Réponse 204 sans corps, même si l'association n'existe pas.
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    RoleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleIdPath:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Rôle ADMIN manquant (403) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Ressource introuvable (404) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Erreur serveur ou SQL (500) — enveloppe ItemError (message, detail,
        code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    ItemError:
      type: object
      required: [message, detail, code]
      properties:
        message:
          type: string
          description: Message lisible en français, toujours renseigné.
        detail:
          type: string
          description: Précision contextuelle (identifiant, champ, contrainte SQL, cause).
        code:
          type: string
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR) ou SQLState PostgreSQL (ex. 23505).
    Role:
      type: object
      required: [ name ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id:
          type: string
          format: uuid
          nullable: true
          description: Obligatoire en pratique à la création (UUID.fromString sans garde).
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true }
