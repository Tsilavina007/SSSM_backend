openapi: 3.0.3
info:
  title: SSSM Authentication — Permissions API
  version: 1.0.0
  description: >-
    API des permissions (module a03_authentication/permission), dérivée du
    contrôleur PermissionController. Toutes les routes exigent le rôle ADMIN.
    Pas de gestion d'exception : les erreurs suivent le format Spring par
    défaut (hors enveloppe). Le DAO capture les SQLException (listes vides,
    création silencieusement en échec avec 200). Pagination : page=1,
    pageSize=10 par défaut.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Permissions
    description: Permissions (ADMIN)
paths:
  /api/permissions:
    get:
      tags: [Permissions]
      summary: Lister les permissions
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Liste paginée des permissions
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Permission'}}
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Permissions]
      summary: Créer une permission
      description: >-
        Une erreur SQL (code en doublon, NOT NULL) est capturée par le DAO :
        la réponse reste 200 et peut contenir un objet sans id.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/Permission'}}
      responses:
        '200':
          description: Permission créée (ou objet d'entrée si l'insertion a échoué silencieusement)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Permission'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/permissions/{id}:
    parameters:
      - {$ref: '#/components/parameters/PermissionId'}
    get:
      tags: [Permissions]
      summary: Récupérer une permission par identifiant
      description: >-
        Un identifiant inexistant renvoie 200 avec un corps null (Optional
        sérialisé), jamais 404.
      responses:
        '200':
          description: Permission trouvée, ou null si absente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Permission'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Permissions]
      summary: Mettre à jour partiellement une permission
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        IllegalArgumentException → 500 au format Spring par défaut. La réponse
        est l'objet envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/Permission'}}
      responses:
        '200':
          description: Permission mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Permission'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Permissions]
      summary: Supprimer une permission
      description: Réponse 200 avec corps vide ; aucune erreur si l'identifiant est inconnu.
      responses:
        '200':
          description: Suppression effectuée (corps vide)
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 10}
    PermissionId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Forbidden:
      description: JWT absent ou rôle ADMIN manquant (403 Spring Security).
    ServerError:
      description: Erreur Spring par défaut hors enveloppe.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SpringError'}
  schemas:
    SpringError:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer}
        error: {type: string}
        path: {type: string}
    Permission:
      type: object
      required: [code, name]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        code: {type: string, maxLength: 150, description: Unique.}
        name: {type: string, maxLength: 150}
        description: {type: string, nullable: true}
