openapi: 3.0.3
info:
  title: SSSM Authentication — Permissions API
  version: 1.0.0
  description: >-
    API des permissions (module a03_authentication/permission), dérivée du
    contrôleur PermissionController. Toutes les routes exigent le rôle ADMIN.
    Toutes les erreurs renvoient l'enveloppe {"errors": {message, detail, code}}
    : 400 (requête invalide, JSON illisible ou UUID malformé), 401 (JWT absent,
    invalide ou expiré), 403 (rôle ADMIN manquant), 404 (permission introuvable
    lors d'une mise à jour), 500 (erreur serveur ou SQL). Pagination : page=1,
    pageSize=10 par défaut.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Permissions
    description: Permissions (ADMIN)
paths:
  /api/permissions:
    get:
      tags: [ Permissions ]
      summary: Lister les permissions
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des permissions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        '403':
          $ref: '#/components/responses/Forbidden'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [ Permissions ]
      summary: Créer une permission
      description: >-
        Une erreur SQL (code en doublon, NOT NULL) renvoie 500 avec une enveloppe ItemError.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Permission' } }
      responses:
        '200':
          description: Permission créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/permissions/{id}:
    parameters:
      - { $ref: '#/components/parameters/PermissionId' }
    get:
      tags: [ Permissions ]
      summary: Récupérer une permission par identifiant
      description: >-
        Un identifiant inexistant renvoie 200 avec un corps null (Optional
        sérialisé), jamais 404.
      responses:
        '200':
          description: Permission trouvée, ou null si absente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [ Permissions ]
      summary: Mettre à jour partiellement une permission
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        NotFoundException → 404 (enveloppe ItemError). La réponse est l'objet
        envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Permission' } }
      responses:
        '200':
          description: Permission mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ Permissions ]
      summary: Supprimer une permission
      description: Réponse 200 avec corps vide ; aucune erreur si l'identifiant est inconnu.
      responses:
        '200':
          description: Suppression effectuée (corps vide)
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    PermissionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Rôle ADMIN manquant (403) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Ressource introuvable (404) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Erreur serveur ou SQL (500) — enveloppe ItemError (message, detail,
        code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    ItemError:
      type: object
      properties:
        message: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        code:
          type: string
          nullable: true
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR) ou SQLState PostgreSQL (ex. 23505).
    Permission:
      type: object
      required: [ code, name ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, maxLength: 150, description: Unique. }
        name: { type: string, maxLength: 150 }
        description: { type: string, nullable: true }
