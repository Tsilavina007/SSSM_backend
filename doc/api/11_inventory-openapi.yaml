openapi: 3.0.3
info:
  title: Inventory API
  version: 1.0.0
  description: Inventory categories, item types, items, warehouses, stock movements and assignments.
servers:
  - url: /
paths:
  /api/item-categories:
    get:
      summary: List ItemCategory resources
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Resource list }
    post:
      summary: Create a ItemCategory
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ItemCategory' } } } }
      responses:
        '200': { description: Created resource }
  /api/item-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get a ItemCategory
      responses:
        '200': { description: Resource }
    patch:
      summary: Partially update a ItemCategory
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ItemCategory' } } } }
      responses:
        '200': { description: Updated resource }
    delete:
      summary: Delete a ItemCategory
      responses:
        '200': { description: Deleted }
  /api/item-types:
    get:
      summary: List ItemType resources
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Resource list }
    post:
      summary: Create a ItemType
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ItemType' } } } }
      responses:
        '200': { description: Created resource }
  /api/item-types/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get a ItemType
      responses:
        '200': { description: Resource }
    patch:
      summary: Partially update a ItemType
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ItemType' } } } }
      responses:
        '200': { description: Updated resource }
    delete:
      summary: Delete a ItemType
      responses:
        '200': { description: Deleted }
  /api/items:
    get:
      summary: List Item resources
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Resource list }
    post:
      summary: Create a Item
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Item' } } } }
      responses:
        '200': { description: Created resource }
  /api/items/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get a Item
      responses:
        '200': { description: Resource }
    patch:
      summary: Partially update a Item
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Item' } } } }
      responses:
        '200': { description: Updated resource }
    delete:
      summary: Delete a Item
      responses:
        '200': { description: Deleted }
  /api/warehouses:
    get:
      summary: List Warehouse resources
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Resource list }
    post:
      summary: Create a Warehouse
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } } }
      responses:
        '200': { description: Created resource }
  /api/warehouses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get a Warehouse
      responses:
        '200': { description: Resource }
    patch:
      summary: Partially update a Warehouse
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } } }
      responses:
        '200': { description: Updated resource }
    delete:
      summary: Delete a Warehouse
      responses:
        '200': { description: Deleted }
  /api/stock-movements:
    get:
      summary: List StockMovement resources
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Resource list }
    post:
      summary: Create a StockMovement
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockMovement' } } } }
      responses:
        '200': { description: Created resource }
  /api/stock-movements/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get a StockMovement
      responses:
        '200': { description: Resource }
    patch:
      summary: Partially update a StockMovement
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockMovement' } } } }
      responses:
        '200': { description: Updated resource }
    delete:
      summary: Delete a StockMovement
      responses:
        '200': { description: Deleted }
  /api/item-assignments:
    get:
      summary: List ItemAssignment resources
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Resource list }
    post:
      summary: Create a ItemAssignment
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ItemAssignment' } } } }
      responses:
        '200': { description: Created resource }
  /api/item-assignments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get a ItemAssignment
      responses:
        '200': { description: Resource }
    patch:
      summary: Partially update a ItemAssignment
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ItemAssignment' } } } }
      responses:
        '200': { description: Updated resource }
    delete:
      summary: Delete a ItemAssignment
      responses:
        '200': { description: Deleted }
components:
  parameters:
    Resource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum: [item_category, item_type, item, warehouse, stock_movement, item_assignment]
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Search:
      name: search
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, default: 10 }
  schemas:
    ItemStatus:
      type: string
      enum: [AVAILABLE, ASSIGNED, DAMAGED, LOST, REPAIR, RETIRED]
    MovementType:
      type: string
      enum: [IN, OUT, TRANSFER, RETURN, ADJUSTMENT]
    ItemCategory:
      type: object
      required: [company_id, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        description: { type: string }
    ItemType:
      type: object
      required: [company_id, code, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, nullable: true }
        code: { type: string, maxLength: 100 }
        name: { type: string, maxLength: 180 }
        description: { type: string }
        unit: { type: string, default: piece }
        quantity_total: { type: number, format: double, minimum: 0 }
        minimum_stock: { type: number, format: double, minimum: 0 }
        status: { $ref: '#/components/schemas/ItemStatus' }
    Item:
      type: object
      required: [company_id, item_type_id, qr_code]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, nullable: true }
        item_type_id: { type: string, format: uuid }
        qr_code: { type: string, maxLength: 100 }
        description: { type: string }
        status: { $ref: '#/components/schemas/ItemStatus' }
    Warehouse:
      type: object
      required: [company_id, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid, nullable: true }
        name: { type: string, maxLength: 150 }
        address: { type: string }
        active: { type: boolean, default: true }
    StockMovement:
      type: object
      required: [warehouse_id, item_id, movement_type]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        warehouse_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid, nullable: true }
        movement_type: { $ref: '#/components/schemas/MovementType' }
        reference: { type: string, maxLength: 150 }
        movement_date: { type: string, format: date-time }
        notes: { type: string }
    ItemAssignment:
      type: object
      required: [item_id, employee_id, post_id]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        item_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        assigned_at: { type: string, format: date-time }
        returned_at: { type: string, format: date-time, nullable: true }
        condition_on_assignment: { type: string }
        condition_on_return: { type: string }
        notes: { type: string }


