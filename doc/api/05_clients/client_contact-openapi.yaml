openapi: 3.0.3
info:
  title: SSSM Clients — Client Contacts API
  version: 1.0.0
  description: >-
    API des contacts clients (module a05_clients/client_contact), dérivée du
    contrôleur ClientContactController. Toutes les routes exigent un JWT. Toutes
    les erreurs renvoient l'enveloppe {"errors": {message, detail, code}} : 400
    (requête invalide, JSON illisible ou UUID malformé), 401 (JWT absent,
    invalide ou expiré), 404 (contact introuvable lors d'une mise à jour), 500
    (erreur serveur ou SQL). La liste par client n'est pas paginée. is_primary
    est envoyé explicitement par le DAO et doit donc être fourni à la création.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: ClientContacts
    description: Contacts rattachés aux clients
paths:
  /api/client-contacts/client/{clientId}:
    parameters:
      - { $ref: '#/components/parameters/ClientId' }
    get:
      tags: [ ClientContacts ]
      summary: Lister les contacts d'un client
      description: Retourne tous les contacts du client, sans pagination.
      responses:
        '200':
          description: Liste des contacts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ClientContact' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/client-contacts:
    post:
      tags: [ ClientContacts ]
      summary: Créer un contact client
      description: >-
        Une erreur SQL renvoie 500 avec une enveloppe ItemError.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ClientContact' } }
      responses:
        '200':
          description: Contact créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientContact' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/client-contacts/{id}:
    parameters:
      - { $ref: '#/components/parameters/ContactId' }
    get:
      tags: [ ClientContacts ]
      summary: Récupérer un contact par identifiant
      description: >-
        Un identifiant inexistant renvoie 200 avec un corps null (Optional
        sérialisé), jamais 404.
      responses:
        '200':
          description: Contact trouvé, ou null si absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientContact' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags: [ ClientContacts ]
      summary: Mettre à jour partiellement un contact
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        NotFoundException → 404 (enveloppe ItemError). La réponse est l'objet
        envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ClientContact' } }
      responses:
        '200':
          description: Contact mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientContact' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ ClientContacts ]
      summary: Supprimer un contact
      description: Réponse 200 avec corps vide ; aucune erreur si l'identifiant est inconnu.
      responses:
        '200':
          description: Suppression effectuée (corps vide)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Ressource introuvable (404) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Erreur serveur ou SQL (500) — enveloppe ItemError (message, detail,
        code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    ItemError:
      type: object
      required: [message, detail, code]
      properties:
        message:
          type: string
          description: Message lisible en français, toujours renseigné.
        detail:
          type: string
          description: Précision contextuelle (identifiant, champ, contrainte SQL, cause).
        code:
          type: string
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR) ou SQLState PostgreSQL (ex. 23505).
    ClientContact:
      type: object
      required: [ client_id, first_name, last_name, is_primary ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        client_id: { type: string, format: uuid }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        function: { type: string, maxLength: 100, nullable: true }
        email: { type: string, format: email, maxLength: 180, nullable: true }
        phone: { type: string, maxLength: 50, nullable: true }
        is_primary: { type: boolean, default: false }
