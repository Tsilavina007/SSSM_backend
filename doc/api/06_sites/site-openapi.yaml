openapi: 3.0.3
info:
  title: SSSM Sites — Sites API
  version: 1.0.0
  description: >-
    API des sites (module a06_sites/site), dérivée du contrôleur SiteController.
    Toutes les routes exigent un JWT. Toutes les erreurs renvoient l'enveloppe
    {"errors": {message, detail, code}} : 400 (requête invalide, JSON illisible
    ou UUID malformé), 401 (JWT absent, invalide ou expiré), 404 (site
    introuvable lors d'une mise à jour), 500 (erreur serveur ou SQL). La lecture
    d'un identifiant absent renvoie encore 200 null. Pagination : page=1,
    pageSize=10 par défaut. Le statut est facultatif à la création : le DAO
    applique ACTIVE si null.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Sites
    description: Sites surveillés
paths:
  /api/sites:
    get:
      tags: [ Sites ]
      summary: Lister les sites
      description: Recherche libre sur name, code et city (ILIKE).
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des sites
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Site' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [ Sites ]
      summary: Créer un site
      description: >-
        Une erreur SQL (contrainte, UUID invalide côté SQL) renvoie 500 avec une
        enveloppe ItemError.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Site' } }
      responses:
        '200':
          description: Site créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/sites/{id}:
    parameters:
      - { $ref: '#/components/parameters/SiteId' }
    get:
      tags: [ Sites ]
      summary: Récupérer un site par identifiant
      description: >-
        Un identifiant inexistant renvoie 200 avec un corps null (Optional
        sérialisé), jamais 404.
      responses:
        '200':
          description: Site trouvé, ou null si absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags: [ Sites ]
      summary: Mettre à jour partiellement un site
      description: >-
        Seuls les champs non null sont écrits (impossible de remettre un champ à
        null). Un identifiant inconnu lève NotFoundException → 404 (enveloppe
        ItemError). La réponse est l'objet envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Site' } }
      responses:
        '200':
          description: Site mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ Sites ]
      summary: Supprimer un site
      description: Réponse 200 avec corps vide ; aucune erreur si l'identifiant est inconnu.
      responses:
        '200':
          description: Suppression effectuée (corps vide)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Recherche libre (ILIKE) sur name, code et city.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    SiteId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Ressource introuvable (404) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Erreur serveur ou SQL (500) — enveloppe ItemError (message, detail,
        code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    ItemError:
      type: object
      required: [message, detail, code]
      properties:
        message:
          type: string
          description: Message lisible en français, toujours renseigné.
        detail:
          type: string
          description: Précision contextuelle (identifiant, champ, contrainte SQL, cause).
        code:
          type: string
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR) ou SQLState PostgreSQL (ex. 23505).
    SiteStatus:
      type: string
      enum: [ ACTIVE, INACTIVE ]
    Site:
      type: object
      required: [ company_id, name ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid, nullable: true }
        branch_id: { type: string, format: uuid, nullable: true }
        name: { type: string, maxLength: 180 }
        code: { type: string, maxLength: 80, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        latitude: { type: number, multipleOf: 1e-7, nullable: true }
        longitude: { type: number, multipleOf: 1e-7, nullable: true }
        status: { $ref: '#/components/schemas/SiteStatus' }
        access_instructions: { type: string, nullable: true }
        risk_level: { type: string, maxLength: 30, nullable: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
