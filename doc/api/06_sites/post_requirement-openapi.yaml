openapi: 3.0.3
info:
  title: SSSM Sites — Post Requirements API
  version: 1.0.0
  description: >-
    API des exigences de poste (module a06_sites/post_requirement), dérivée du
    contrôleur PostRequirementController. Toutes les routes exigent un JWT.
    Toutes les erreurs renvoient l'enveloppe {"errors": {message, detail, code}}
    : 400 (requête invalide, JSON illisible ou UUID malformé), 401 (JWT absent,
    invalide ou expiré), 404 (exigence introuvable lors d'une mise à jour), 500
    (erreur serveur ou SQL). La liste par poste n'est pas paginée et est triée
    par requirement.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: PostRequirements
    description: Exigences rattachées aux postes de sécurité
paths:
  /api/post-requirements/post/{postId}:
    parameters:
      - { $ref: '#/components/parameters/PostId' }
    get:
      tags: [ PostRequirements ]
      summary: Lister les exigences d'un poste
      description: Retourne toutes les exigences du poste, triées par requirement.
      responses:
        '200':
          description: Liste des exigences
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PostRequirement' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/post-requirements:
    post:
      tags: [ PostRequirements ]
      summary: Créer une exigence de poste
      description: >-
        Une erreur SQL renvoie 500 avec une enveloppe ItemError.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PostRequirement' } }
      responses:
        '201':
          description: Exigence créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostRequirement' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/post-requirements/{id}:
    parameters:
      - { $ref: '#/components/parameters/RequirementId' }
    get:
      tags: [ PostRequirements ]
      summary: Récupérer une exigence par identifiant
      description: >-
        Un identifiant inexistant renvoie 404 avec l'enveloppe ItemError.
      responses:
        '200':
          description: Exigence trouvée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostRequirement' }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags: [ PostRequirements ]
      summary: Mettre à jour partiellement une exigence
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        NotFoundException → 404 (enveloppe ItemError). La réponse est l'objet
        envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PostRequirement' } }
      responses:
        '200':
          description: Exigence mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostRequirement' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ PostRequirements ]
      summary: Supprimer une exigence
      description: Réponse 204 sans corps ; aucune erreur si l'identifiant est inconnu (suppression idempotente).
      responses:
        '204':
          description: Opération effectuée (sans corps).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequirementId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Ressource introuvable (404) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Erreur serveur ou SQL (500) — enveloppe ItemError (message, detail,
        code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    ItemError:
      type: object
      required: [message, detail, code]
      properties:
        message:
          type: string
          description: Message lisible en français, toujours renseigné.
        detail:
          type: string
          description: Précision contextuelle (identifiant, champ, contrainte SQL, cause).
        code:
          type: string
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR) ou SQLState PostgreSQL (ex. 23505).
    PostRequirement:
      type: object
      required: [ post_id, requirement ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        post_id: { type: string, format: uuid }
        requirement: { type: string, maxLength: 180 }
