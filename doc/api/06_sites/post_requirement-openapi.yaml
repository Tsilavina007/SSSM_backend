openapi: 3.0.3
info:
  title: SSSM Sites — Post Requirements API
  version: 1.0.0
  description: >-
    API des exigences de poste (module a06_sites/post_requirement), dérivée du
    contrôleur PostRequirementController. Toutes les routes exigent un JWT.
    Pas de gestion d'exception : les erreurs suivent le format Spring par
    défaut (hors enveloppe). Le DAO capture les SQLException (listes vides,
    création silencieusement en échec avec 200). La liste par poste n'est pas
    paginée et est triée par requirement.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: PostRequirements
    description: Exigences rattachées aux postes de sécurité
paths:
  /api/post-requirements/post/{postId}:
    parameters:
      - {$ref: '#/components/parameters/PostId'}
    get:
      tags: [PostRequirements]
      summary: Lister les exigences d'un poste
      description: Retourne toutes les exigences du poste, triées par requirement.
      responses:
        '200':
          description: Liste des exigences
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PostRequirement'}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/post-requirements:
    post:
      tags: [PostRequirements]
      summary: Créer une exigence de poste
      description: >-
        Une erreur SQL est capturée par le DAO : la réponse reste 200 et peut
        contenir un objet sans id.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PostRequirement'}}
      responses:
        '200':
          description: Exigence créée (ou objet d'entrée si l'insertion a échoué silencieusement)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostRequirement'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/post-requirements/{id}:
    parameters:
      - {$ref: '#/components/parameters/RequirementId'}
    get:
      tags: [PostRequirements]
      summary: Récupérer une exigence par identifiant
      description: >-
        Un identifiant inexistant renvoie 200 avec un corps null (Optional
        sérialisé), jamais 404.
      responses:
        '200':
          description: Exigence trouvée, ou null si absente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostRequirement'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [PostRequirements]
      summary: Mettre à jour partiellement une exigence
      description: >-
        Seuls les champs non null sont écrits. Un identifiant inconnu lève
        IllegalArgumentException → 500 au format Spring par défaut. La réponse
        est l'objet envoyé complété de l'id.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PostRequirement'}}
      responses:
        '200':
          description: Exigence mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostRequirement'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [PostRequirements]
      summary: Supprimer une exigence
      description: Réponse 200 avec corps vide ; aucune erreur si l'identifiant est inconnu.
      responses:
        '200':
          description: Suppression effectuée (corps vide)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RequirementId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Unauthorized:
      description: JWT invalide ou expiré (401, enveloppe) ; JWT absent → 403 Spring Security.
    ServerError:
      description: Erreur Spring par défaut hors enveloppe.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SpringError'}
  schemas:
    SpringError:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer}
        error: {type: string}
        path: {type: string}
    PostRequirement:
      type: object
      required: [post_id, requirement]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        post_id: {type: string, format: uuid}
        requirement: {type: string, maxLength: 180}
