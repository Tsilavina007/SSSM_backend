openapi: 3.0.3
info:
  title: SSSM Authentication and RBAC API
  version: 1.0.0
  description: |
    API de gestion des utilisateurs, rôles et permissions du SSSM.
    Elle correspond aux tables `app_user`, `role`, `permission`,
    `user_role` et `role_permission` du schéma PostgreSQL `security`.
servers:
  - url: http://localhost:8080
    description: Serveur local
tags:
  - name: Users
    description: Gestion des utilisateurs
  - name: Roles
    description: Gestion des rôles et de leurs permissions
  - name: Permissions
    description: Gestion des permissions disponibles
paths:
  /api/users:
    get:
      tags: [Users]
      summary: Lister les utilisateurs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Liste paginée des utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppUser'
    post:
      tags: [Users]
      summary: Créer un utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserCreate'
      responses:
        '200':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
  /api/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Récupérer un utilisateur
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Modifier un utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserUpdate'
      responses:
        '200':
          description: Utilisateur modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
    delete:
      tags: [Users]
      summary: Supprimer un utilisateur
      responses:
        '200':
          description: Utilisateur supprimé
  /api/users/{userId}/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/RoleId'
    post:
      tags: [Users]
      summary: Attribuer un rôle à un utilisateur
      responses:
        '200':
          description: Rôle attribué
    delete:
      tags: [Users]
      summary: Retirer un rôle d’un utilisateur
      responses:
        '200':
          description: Rôle retiré

  /api/roles:
    get:
      tags: [Roles]
      summary: Lister les rôles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Liste paginée des rôles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
    post:
      tags: [Roles]
      summary: Créer un rôle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '200':
          description: Rôle créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
  /api/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    get:
      tags: [Roles]
      summary: Récupérer un rôle
      responses:
        '200':
          description: Rôle trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Roles]
      summary: Modifier un rôle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: Rôle modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
    delete:
      tags: [Roles]
      summary: Supprimer un rôle
      responses:
        '200':
          description: Rôle supprimé
  /api/roles/{roleId}/permissions/{permissionId}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
      - $ref: '#/components/parameters/PermissionId'
    post:
      tags: [Roles]
      summary: Attribuer une permission à un rôle
      responses:
        '200':
          description: Permission attribuée
    delete:
      tags: [Roles]
      summary: Retirer une permission d’un rôle
      responses:
        '200':
          description: Permission retirée

  /api/permissions:
    get:
      tags: [Permissions]
      summary: Lister les permissions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Liste paginée des permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
    post:
      tags: [Permissions]
      summary: Créer une permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionCreate'
      responses:
        '200':
          description: Permission créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
  /api/permissions/{permissionId}:
    parameters:
      - $ref: '#/components/parameters/PermissionId'
    get:
      tags: [Permissions]
      summary: Récupérer une permission
      responses:
        '200':
          description: Permission trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Permissions]
      summary: Modifier une permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionUpdate'
      responses:
        '200':
          description: Permission modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
    delete:
      tags: [Permissions]
      summary: Supprimer une permission
      responses:
        '200':
          description: Permission supprimée

components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        default: 10
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Ressource introuvable
  schemas:
    AppUser:
      type: object
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid, nullable: true}
        username: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 180}
        first_name: {type: string, maxLength: 100}
        last_name: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 50}
        status: {type: string, enum: [ACTIVE, INACTIVE, LOCKED]}
        last_login_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AppUserCreate:
      type: object
      required: [username, password_hash]
      properties:
        company_id: {type: string, format: uuid, nullable: true}
        username: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 180}
        password_hash: {type: string, format: password}
        first_name: {type: string, maxLength: 100}
        last_name: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 50}
        status: {type: string, enum: [ACTIVE, INACTIVE, LOCKED], default: ACTIVE}
    AppUserUpdate:
      type: object
      properties:
        email: {type: string, format: email, maxLength: 180}
        password_hash: {type: string, format: password}
        first_name: {type: string, maxLength: 100}
        last_name: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 50}
        status: {type: string, enum: [ACTIVE, INACTIVE, LOCKED]}
    Role:
      type: object
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid, nullable: true}
        name: {type: string, maxLength: 100}
        description: {type: string}
    RoleCreate:
      type: object
      required: [name]
      properties:
        company_id: {type: string, format: uuid, nullable: true}
        name: {type: string, maxLength: 100}
        description: {type: string}
    RoleUpdate:
      type: object
      properties:
        company_id: {type: string, format: uuid, nullable: true}
        name: {type: string, maxLength: 100}
        description: {type: string}
    Permission:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string, maxLength: 150}
        name: {type: string, maxLength: 150}
        description: {type: string}
    PermissionCreate:
      type: object
      required: [code, name]
      properties:
        code: {type: string, maxLength: 150}
        name: {type: string, maxLength: 150}
        description: {type: string}
    PermissionUpdate:
      type: object
      properties:
        code: {type: string, maxLength: 150}
        name: {type: string, maxLength: 150}
        description: {type: string}
