openapi: 3.0.3
info:
  title: SSSM Inventory — QR Scans API
  version: 1.0.0
  description: >-
    API de résolution de QR codes (module a11_inventory/qr_scan), dérivée du
    contrôleur QrScanController. Toutes les routes exigent un JWT
    (Authorization: Bearer …). Le corps attend l'enregistrement
    {"qrCode": "…"} — toute autre forme provoque une erreur 400 (Spring, hors
    enveloppe). Une valeur inconnue renvoie une liste vide (pas d'erreur).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: QR Scans
    description: Résolution de QR codes
paths:
  /api/inventory/scans/resolve:
    post:
      tags: [QR Scans]
      summary: Résoudre un QR code vers l article
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/QrScanRequest'}}
      responses:
        '200':
          description: >-
            Liste des articles correspondants — vide si le QR code est
            inconnu.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/QrScanItem'}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters: {}
  responses:
    BadRequest:
      description: >-
        Corps malformé (JSON invalide ou ne correspondant pas à l'enregistrement
        QrScanRequest) — format d'erreur Spring par défaut, hors enveloppe du
        module.
    ServerError:
      description: >-
        Erreur serveur — enveloppe {"errors": …} (ServerException) ou format
        d'erreur Spring par défaut.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: {$ref: '#/components/schemas/Error'}
    Error:
      type: object
      properties:
        message: {type: string, nullable: true}
        detail: {type: string, nullable: true}
        code: {type: string, nullable: true, description: SQLState PostgreSQL (ex. 23505).}
    ItemStatus:
      type: string
      enum: [AVAILABLE, ASSIGNED, DAMAGED, LOST, REPAIR, RETIRED]
    QrScanRequest:
      type: object
      description: Enregistrement exact attendu par le contrôleur (record QrScanRequest).
      required: [qrCode]
      properties:
        qrCode:
          type: string
          description: Chaîne du QR code scanné (propriété exacte « qrCode »).
    QrScanItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        category_id: {type: string, format: uuid, nullable: true}
        item_type_id: {type: string, format: uuid}
        qr_code: {type: string}
        description: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/ItemStatus'}
        current_warehouse_id: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: string, format: date-time, nullable: true}
        archived_by: {type: string, format: uuid, nullable: true}
        last_inventory_at: {type: string, format: date-time, nullable: true}
