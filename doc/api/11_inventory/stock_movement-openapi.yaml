openapi: 3.0.3
info:
  title: SSSM Inventory — Stock Movements API
  version: 1.0.0
  description: >-
    API des mouvements de stock (module a11_inventory/stock_movement), dérivée
    du contrôleur StockMovementController. Toutes les routes exigent un JWT
    (Authorization: Bearer …). Erreurs : enveloppe {"errors": {message, detail,
    code}} ; une requête malformée (JSON/UUID invalide) renvoie l'erreur Spring
    par défaut. Pagination : page=1, pageSize=10 par défaut. Aucune validation
    Jakarta — les champs marqués « requis » le sont par la base (NOT NULL sans
    défaut).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Stock Movements
    description: Mouvements de stock
paths:
  /api/inventory/movements:
    get:
      tags: [Stock Movements]
      summary: Lister les mouvements de stock
      parameters:
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Liste paginée des mouvements
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/StockMovement'}}
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Stock Movements]
      summary: Créer un mouvement de stock
      description: >-
        movement_date absent → défaut base now() mais la réponse fait écho du
        corps de la requête : movement_date y est alors null (comportement
        voulu, tests de non-régression associés).
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/StockMovementCreate'}}
      responses:
        '200':
          description: Mouvement créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockMovement'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/inventory/movements/{movementId}:
    parameters:
      - {$ref: '#/components/parameters/MovementId'}
    get:
      tags: [Stock Movements]
      summary: Récupérer un mouvement par identifiant
      responses:
        '200':
          description: Mouvement trouvé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockMovement'}
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Stock Movements]
      summary: Mettre à jour partiellement un mouvement
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/StockMovementUpdate'}}
      responses:
        '200':
          description: Mouvement mis à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockMovement'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Stock Movements]
      summary: Supprimer un mouvement
      description: >-
        Ne renvoie jamais 404 : la suppression d'un identifiant inexistant
        renvoie quand même 200, avec un corps vide.
      responses:
        '200':
          description: 200 sans corps
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: {type: string}
      description: Recherche libre (ILIKE) selon la ressource.
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 10}
    MovementId:
      name: movementId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: >-
        Requête malformée (désérialisation JSON) — format d'erreur Spring par
        défaut, hors enveloppe du module.
    NotFound:
      description: Mouvement introuvable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ServerError:
      description: >-
        Erreur serveur — enveloppe {"errors": …} (ServerException) ou format
        d'erreur Spring par défaut (identifiant/UUID malformé).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: {$ref: '#/components/schemas/Error'}
    Error:
      type: object
      properties:
        message: {type: string, nullable: true}
        detail: {type: string, nullable: true}
        code: {type: string, nullable: true, description: SQLState PostgreSQL (ex. 23505).}
    MovementType:
      type: string
      enum: [IN, OUT, TRANSFER, RETURN, ADJUSTMENT]
    StockMovement:
      type: object
      properties:
        id: {type: string, format: uuid}
        warehouse_id: {type: string, format: uuid}
        item_id: {type: string, format: uuid}
        employee_id: {type: string, format: uuid, nullable: true}
        movement_type: {$ref: '#/components/schemas/MovementType'}
        reference: {type: string, nullable: true}
        movement_date: {type: string, format: date-time, nullable: true}
        notes: {type: string, nullable: true}
    StockMovementCreate:
      type: object
      description: >-
        Corps de création. warehouse_id et item_id sont NOT NULL sans défaut
        dans la base : leur omission provoque une erreur 500. movement_type
        (défaut applicatif IN) et movement_date (défaut base now()) sont
        facultatifs.
      required: [warehouse_id, item_id]
      properties:
        warehouse_id: {type: string, format: uuid}
        item_id: {type: string, format: uuid}
        employee_id: {type: string, format: uuid, nullable: true}
        movement_type: {$ref: '#/components/schemas/MovementType'}
        reference: {type: string, nullable: true}
        movement_date: {type: string, format: date-time, nullable: true}
        notes: {type: string, nullable: true}
    StockMovementUpdate:
      type: object
      description: Tous les champs sont facultatifs (mise à jour partielle).
      properties:
        warehouse_id: {type: string, format: uuid}
        item_id: {type: string, format: uuid}
        employee_id: {type: string, format: uuid, nullable: true}
        movement_type: {$ref: '#/components/schemas/MovementType'}
        reference: {type: string, nullable: true}
        movement_date: {type: string, format: date-time, nullable: true}
        notes: {type: string, nullable: true}
