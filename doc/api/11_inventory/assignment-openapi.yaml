openapi: 3.0.3
info:
  title: SSSM Inventory — Assignments API
  version: 1.0.0
  description: >-
    API des affectations (module a11_inventory/assignment, famille « générique »
    à corps Map), dérivée du contrôleur AssignmentController. Attention : module
    distinct de item_assignment exposé sous /api/item-assignments (dette
    d'architecture A/B, non décidée). Toutes les routes exigent un JWT
    (Authorization: Bearer …). Corps : objet libre dont les clés sont validées
    par regex puis transmises telles quelles au SQL — seules les colonnes de
    security.item_assignment (sauf id) sont acceptées, le reste produit une
    erreur 500. Réponses en 200 : ligne mapée en AssignmentRest, ou carte
    {"errors": ItemError} en cas d'échec doux (corps vide, aucune colonne
    writable, introuvable) — l'identifiant inexistant ne renvoie jamais 404 ici
    (dette connue). Pagination : page=1, pageSize=50 (max 500).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Assignments
    description: Affectations (module générique)
paths:
  /api/inventory/assignments:
    get:
      tags: [ Assignments ]
      summary: Lister les affectations actives
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des affectations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Assignments ]
      summary: Créer une affectation
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AssignmentUpsert' } }
      responses:
        '200':
          description: 'Affectation créée, ou enveloppe {"errors": ItemError} si le corps
            est vide ou sans colonne writable'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Assignment' }
                  - { $ref: '#/components/schemas/FamilyCError' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/assignments/{id}:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    get:
      tags: [ Assignments ]
      summary: Récupérer une affectation
      description: 'Identifiant inexistant → 200 {"errors": ItemError} (code
        NOT_FOUND, detail id) (jamais 404).'
      responses:
        '200':
          description: 'Affectation trouvée, ou enveloppe {"errors": ItemError} si
            introuvable'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Assignment' }
                  - { $ref: '#/components/schemas/FamilyCError' }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [ Assignments ]
      summary: Mettre à jour partiellement une affectation
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AssignmentUpsert' } }
      responses:
        '200':
          description: 'Affectation mise à jour, ou enveloppe {"errors": ItemError}'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Assignment' }
                  - { $ref: '#/components/schemas/FamilyCError' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/assignments/{id}/return:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    post:
      tags: [ Assignments ]
      summary: Enregistrer le retour d une affectation
      description: >-
        Même mécanique que PATCH : corps Map (typiquement returned_at,
        condition_on_return, returned_by). Identifiant inexistant → 200 carte
        {"errors": ItemError}.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AssignmentUpsert' } }
      responses:
        '200':
          description: 'Affectation mise à jour, ou enveloppe {"errors": ItemError}'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Assignment' }
                  - { $ref: '#/components/schemas/FamilyCError' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/employees/{employeeId}/assignments:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [ Assignments ]
      summary: Lister les affectations d un employé
      responses:
        '200':
          description: Liste des affectations de l'employé
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/security-posts/{postId}/assignments:
    parameters:
      - name: postId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [ Assignments ]
      summary: Lister les affectations d un poste de sécurité
      responses:
        '200':
          description: Liste des affectations du poste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    AssignmentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Erreur serveur ou SQL (500) — enveloppe ItemError (message, detail,
        code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    ItemError:
      type: object
      properties:
        message: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        code:
          type: string
          nullable: true
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR) ou SQLState PostgreSQL (ex. 23505).
    FamilyCError:
      type: object
      description: >-
        Erreur douce renvoyée en 200 par les opérations de cette famille
        (enveloppe ItemError, code NOT_FOUND ou BAD_REQUEST).
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    Assignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        assigned_at: { type: string, format: date-time, nullable: true }
        returned_at: { type: string, format: date-time, nullable: true }
        condition_on_assignment: { type: string, nullable: true }
        condition_on_return: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        assigned_by: { type: string, format: uuid, nullable: true }
        returned_by: { type: string, format: uuid, nullable: true }
        expected_return_at: { type: string, format: date-time, nullable: true }
    AssignmentUpsert:
      type: object
      description: >-
        Corps Map générique (famille C). Les clés doivent être des identifiants
        SQL valides ; toute colonne de security.item_assignment sauf id est
        acceptée, y compris les colonnes audit created_at, updated_at,
        assigned_by, returned_by, expected_return_at (dette de masse
        d'affectation, options A/B/C non décidées). Colonnes NOT NULL sans
        défaut : item_id, employee_id, post_id — leur omission provoque une
        erreur 500 (et non 400).
      required: [ item_id, employee_id, post_id ]
      additionalProperties: true
      properties:
        item_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        assigned_at: { type: string, format: date-time, nullable: true }
        returned_at: { type: string, format: date-time, nullable: true }
        condition_on_assignment: { type: string, nullable: true }
        condition_on_return: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        assigned_by: { type: string, format: uuid, nullable: true }
        returned_by: { type: string, format: uuid, nullable: true }
        expected_return_at: { type: string, format: date-time, nullable: true }
