openapi: 3.0.3
info:
  title: SSSM Inventory — Warehouses API
  version: 1.0.0
  description: >-
    API des entrepôts (module a11_inventory/warehouse), dérivée du contrôleur
    WarehouseController. Toutes les routes exigent un JWT (Authorization: Bearer
    …). Erreurs : enveloppe {"errors": {message, detail, code}} ; une requête
    malformée renvoie l'erreur enveloppe ItemError. Pagination : page=1,
    pageSize=10 par défaut. Aucune validation Jakarta — les champs marqués «
    requis » le sont par la base (NOT NULL sans défaut).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Warehouses
    description: Entrepôts
paths:
  /api/inventory/warehouses:
    get:
      tags: [ Warehouses ]
      summary: Lister les entrepôts
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Liste paginée des entrepôts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Warehouse' } }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Warehouses ]
      summary: Créer un entrepôt
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/WarehouseCreate' } }
      responses:
        '200':
          description: Entrepôt créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/inventory/warehouses/{warehouseId}:
    parameters:
      - { $ref: '#/components/parameters/WarehouseId' }
    get:
      tags: [ Warehouses ]
      summary: Récupérer un entrepôt par identifiant
      responses:
        '200':
          description: Entrepôt trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [ Warehouses ]
      summary: Mettre à jour partiellement un entrepôt
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/WarehouseUpdate' } }
      responses:
        '200':
          description: Entrepôt mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [ Warehouses ]
      summary: Supprimer un entrepôt
      description: >-
        Ne renvoie jamais 404 : la suppression d'un identifiant inexistant
        renvoie quand même 200 (le DELETE SQL n'affecte aucune ligne).
      responses:
        '200':
          description: Message de confirmation (chaîne JSON)
          content:
            application/json:
              schema:
                {
                  type: string,
                  example: 'Warehouse deleted : 3f0c2f70-0000-4000-8000-000000000001'
                }
        '500':
          $ref: '#/components/responses/ServerError'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Recherche libre (ILIKE) selon la ressource.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide (JSON illisible, UUID ou paramètre malformé,
        validation) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: JWT absent, invalide ou expiré (401) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Ressource introuvable (404) — enveloppe ItemError.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Erreur serveur ou SQL (500) — enveloppe ItemError (message, detail,
        code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors: { $ref: '#/components/schemas/ItemError' }
    ItemError:
      type: object
      properties:
        message: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        code:
          type: string
          nullable: true
          description: >-
            Code applicatif (BAD_REQUEST, VALIDATION_ERROR,
            INVALID_REQUEST_BODY, NOT_FOUND, CLIENT_ERROR, SERVER_ERROR,
            UNAUTHORIZED, FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            INTERNAL_ERROR) ou SQLState PostgreSQL (ex. 23505).
    CompanyBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    AgencyBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        name: { type: string }
    BranchBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        agence: { $ref: '#/components/schemas/AgencyBrief' }
        name: { type: string }
    Warehouse:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { $ref: '#/components/schemas/CompanyBrief' }
        branch: { $ref: '#/components/schemas/BranchBrief' }
        name: { type: string }
        address: { type: string, nullable: true }
        active: { type: boolean, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
    WarehouseCreate:
      type: object
      description: >-
        Corps de création. Les champs requis le sont par la base (NOT NULL sans
        défaut) : leur omission provoque une erreur 500. active a une valeur par
        défaut en base.
      required: [ company_id, name ]
      properties:
        company_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        address: { type: string, nullable: true }
        active: { type: boolean, nullable: true }
    WarehouseUpdate:
      type: object
      description: Tous les champs sont facultatifs (mise à jour partielle).
      properties:
        company_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        address: { type: string, nullable: true }
        active: { type: boolean, nullable: true }
